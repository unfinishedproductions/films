<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>Arctic Base 360 Viewer</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #000;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overscroll-behavior: none;
}

* {
  box-sizing: border-box;
}

#app {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;

  width: 100%;
  height: 100%;

  touch-action: none;
}

#status {
  position: fixed;

  top:
    max(
      12px,
      env(safe-area-inset-top)
    );

  left: 12px;

  z-index: 10;

  padding:
    7px
    10px;

  border-radius: 9px;

  background:
    rgba(0,0,0,.52);

  color: white;

  font-size: 12px;

  pointer-events: none;

  backdrop-filter:
    blur(8px);
}

#error {
  position: fixed;

  left: 12px;
  right: 12px;

  top: 60px;

  z-index: 20;

  display: none;

  padding: 12px;

  border-radius: 10px;

  color: white;

  background:
    rgba(125,0,0,.92);

  font-size: 13px;

  line-height: 1.4;
}

#crosshair {
  position: fixed;

  left: 50%;
  top: 50%;

  width: 4px;
  height: 4px;

  margin-left: -2px;
  margin-top: -2px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.65);

  pointer-events: none;
}
</style>
</head>

<body>

<div id="app"></div>

<div id="status">
  Loading Arctic Base…
</div>

<div id="error"></div>

<div id="crosshair"></div>


<script type="importmap">
{
  "imports": {
    "three":
    "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js"
  }
}
</script>


<script type="module">

import * as THREE from "three";


/* =========================================================
   IMAGE

   PUT THIS FILE BESIDE index.html:

   arctic_lab_panorama_4096x2048.png

   GitHub example:

   /your-repository/
       index.html
       arctic_lab_panorama_4096x2048.png
========================================================= */

const IMAGE_URL =
  "./arctic_lab_panorama_4096x2048.png";


const app =
  document.getElementById(
    "app"
  );


const status =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );


function showError(
  message
){

  console.error(
    message
  );


  errorBox.style.display =
    "block";


  errorBox.textContent =
    message;


  status.textContent =
    "IMAGE LOAD FAILED";

}


/* =========================================================
   SCENE
========================================================= */

const scene =
  new THREE.Scene();


/* =========================================================
   CAMERA

   Camera sits at the exact center of the panorama sphere.

   This is important.

   A standard 360 equirectangular image represents light
   captured from one point in space.

   At the capture point it appears undistorted.
========================================================= */

const camera =
  new THREE.PerspectiveCamera(

    70,

    window.innerWidth /
    window.innerHeight,

    0.01,

    100

  );


camera.position.set(

  0,

  0,

  0

);


camera.rotation.order =
  "YXZ";


/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({

    antialias:
      true,

    powerPreference:
      "high-performance",

    alpha:
      false

  });


renderer.setSize(

  window.innerWidth,

  window.innerHeight

);


renderer.setPixelRatio(

  Math.min(

    window.devicePixelRatio,

    2

  )

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


app.appendChild(
  renderer.domElement
);


/* =========================================================
   LOAD THE ACTUAL 4096 × 2048 PNG

   This is deliberately direct.

   NO fetch()
   NO createImageBitmap()
   NO canvas resize
   NO AVIF conversion
   NO ChatGPT URL
   NO base64 conversion

   THREE.TextureLoader reads the original PNG.
========================================================= */

let texture;


try {

  texture =

    await new THREE
      .TextureLoader()
      .loadAsync(

        IMAGE_URL

      );

}


catch(
  err
){

  console.error(
    "TextureLoader error:",
    err
  );


  showError(

    "Could not load "
    +

    IMAGE_URL
    +

    ". Make sure the PNG and this HTML file are in the same GitHub folder and that capitalization matches exactly."

  );


  throw err;

}


/* =========================================================
   VERIFY IMAGE RESOLUTION
========================================================= */

const imageWidth =

  texture.image
  ?.naturalWidth

  ||

  texture.image
  ?.width

  ||

  0;


const imageHeight =

  texture.image
  ?.naturalHeight

  ||

  texture.image
  ?.height

  ||

  0;


console.log(

  "Loaded panorama:",

  IMAGE_URL,

  imageWidth +
  " × " +
  imageHeight

);


status.textContent =

  `ARCTIC BASE · ${imageWidth} × ${imageHeight}`;


/*
Warn visibly if GitHub contains the wrong image.
*/

if(

  imageWidth !==
  4096

  ||

  imageHeight !==
  2048

){

  status.textContent =

    `WARNING · IMAGE IS ${imageWidth} × ${imageHeight}`;


  console.warn(

    "Expected 4096 × 2048, received:",

    imageWidth,

    imageHeight

  );

}


/* =========================================================
   TEXTURE QUALITY
========================================================= */

texture.colorSpace =
  THREE.SRGBColorSpace;


texture.wrapS =
  THREE.ClampToEdgeWrapping;


texture.wrapT =
  THREE.ClampToEdgeWrapping;


texture.minFilter =
  THREE.LinearMipmapLinearFilter;


texture.magFilter =
  THREE.LinearFilter;


texture.generateMipmaps =
  true;


texture.anisotropy =

  Math.min(

    16,

    renderer
      .capabilities
      .getMaxAnisotropy()

  );


texture.needsUpdate =
  true;


/* =========================================================
   SPHERE

   This is the method that previously looked right:

              ONE panorama
                    ↓
             ONE entire sphere
                    ↓
           camera at sphere center

   We DO NOT divide it into:

   cylinder
   +
   ceiling dome
   +
   lower floor strip

   That was what caused the horrible stretching.
========================================================= */

const sphereGeometry =
  new THREE.SphereGeometry(

    10,

    256,

    128

  );


/*
Invert the X axis.

This turns the normal outward-facing sphere into an
inward-facing panorama sphere.

This is the standard Three.js 360 panorama approach.
*/

sphereGeometry.scale(

  -1,

  1,

  1

);


const sphereMaterial =
  new THREE.MeshBasicMaterial({

    map:
      texture,

    side:
      THREE.FrontSide,

    depthWrite:
      false

  });


const panorama =
  new THREE.Mesh(

    sphereGeometry,

    sphereMaterial

  );


panorama.frustumCulled =
  false;


scene.add(
  panorama
);


/* =========================================================
   LOOK CONTROLS
========================================================= */

let yaw =
  0;


let pitch =
  0;


let targetFov =
  70;


/* =========================================================
   POINTER TRACKING
========================================================= */

const pointers =
  new Map();


let dragging =
  false;


let lastX =
  0;


let lastY =
  0;


let pinchStartDistance =
  0;


let pinchStartFov =
  70;


/* =========================================================
   POINTER DOWN
========================================================= */

renderer
  .domElement
  .addEventListener(

    "pointerdown",

    event => {

      pointers.set(

        event.pointerId,

        {

          x:
            event.clientX,

          y:
            event.clientY

        }

      );


      /*
      Two fingers = begin zoom.
      */

      if(
        pointers.size ===
        2
      ){

        const points =
          [
            ...pointers.values()
          ];


        pinchStartDistance =

          Math.hypot(

            points[0].x -
            points[1].x,

            points[0].y -
            points[1].y

          );


        pinchStartFov =
          targetFov;


        dragging =
          false;


        return;

      }


      dragging =
        true;


      lastX =
        event.clientX;


      lastY =
        event.clientY;


      try {

        renderer
          .domElement
          .setPointerCapture(

            event.pointerId

          );

      }

      catch(
        error
      ){}

    }

  );


/* =========================================================
   POINTER MOVE
========================================================= */

renderer
  .domElement
  .addEventListener(

    "pointermove",

    event => {

      /*
      Update stored finger position.
      */

      if(
        pointers.has(
          event.pointerId
        )
      ){

        pointers.set(

          event.pointerId,

          {

            x:
              event.clientX,

            y:
              event.clientY

          }

        );

      }


      /* =====================================================
         PINCH ZOOM
      ===================================================== */

      if(

        pointers.size ===
        2

        &&

        pinchStartDistance >
        0

      ){

        const points =
          [
            ...pointers.values()
          ];


        const distance =

          Math.hypot(

            points[0].x -
            points[1].x,

            points[0].y -
            points[1].y

          );


        targetFov =

          THREE.MathUtils.clamp(

            pinchStartFov

            *

            (
              pinchStartDistance
              /
              distance
            ),

            25,

            100

          );


        return;

      }


      /* =====================================================
         ROTATE VIEW
      ===================================================== */

      if(
        !dragging
      ){

        return;

      }


      const dx =

        event.clientX -
        lastX;


      const dy =

        event.clientY -
        lastY;


      lastX =
        event.clientX;


      lastY =
        event.clientY;


      yaw -=

        dx *
        0.004;


      pitch -=

        dy *
        0.004;


      pitch =

        THREE.MathUtils.clamp(

          pitch,

          -Math.PI / 2 +
          0.01,

          Math.PI / 2 -
          0.01

        );

    }

  );


/* =========================================================
   POINTER RELEASE
========================================================= */

function releasePointer(
  event
){

  pointers.delete(
    event.pointerId
  );


  /*
  If only one finger remains after pinch,
  restart rotation using that finger.
  */

  if(
    pointers.size ===
    1
  ){

    const remaining =
      [
        ...pointers.values()
      ][0];


    lastX =
      remaining.x;


    lastY =
      remaining.y;


    dragging =
      true;


    pinchStartDistance =
      0;

  }


  else if(
    pointers.size ===
    0
  ){

    dragging =
      false;


    pinchStartDistance =
      0;

  }


  try {

    renderer
      .domElement
      .releasePointerCapture(

        event.pointerId

      );

  }

  catch(
    error
  ){}

}


renderer
  .domElement
  .addEventListener(

    "pointerup",

    releasePointer

  );


renderer
  .domElement
  .addEventListener(

    "pointercancel",

    releasePointer

  );


/* =========================================================
   DESKTOP MOUSE WHEEL ZOOM
========================================================= */

renderer
  .domElement
  .addEventListener(

    "wheel",

    event => {

      event.preventDefault();


      targetFov =

        THREE.MathUtils.clamp(

          targetFov

          +

          event.deltaY *
          0.03,

          25,

          100

        );

    },

    {
      passive:
        false
    }

  );


/* =========================================================
   RENDER LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  /*
  Smooth zoom.
  */

  camera.fov +=

    (
      targetFov -
      camera.fov
    )

    *

    0.14;


  camera.updateProjectionMatrix();


  camera.rotation.y =
    yaw;


  camera.rotation.x =
    pitch;


  renderer.render(

    scene,

    camera

  );

}


animate();


/* =========================================================
   RESIZE / PHONE ROTATION
========================================================= */

function resize(){

  camera.aspect =

    window.innerWidth /
    window.innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(

    window.innerWidth,

    window.innerHeight

  );


  renderer.setPixelRatio(

    Math.min(

      window.devicePixelRatio,

      2

    )

  );

}


window.addEventListener(

  "resize",

  resize

);


screen.orientation
  ?.addEventListener
  ?.(
    "change",

    resize

  );

</script>

</body>
</html>
