<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
>

<title>360 Virtual Production Volume</title>

<style>
html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overscroll-behavior: none;
}

* {
  box-sizing: border-box;
}

#app {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

button {
  font: inherit;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

#menuBtn {
  position: fixed;

  top: max(
    14px,
    env(safe-area-inset-top)
  );

  right: 14px;

  z-index: 60;

  width: 48px;
  height: 48px;

  display: grid;
  place-items: center;

  border:
    1px solid
    rgba(255,255,255,.18);

  border-radius: 14px;

  background:
    rgba(10,10,10,.62);

  color: #fff;

  font-size: 25px;

  backdrop-filter:
    blur(12px);
}

#menu {
  position: fixed;

  top: 70px;
  right: 14px;

  z-index: 55;

  width:
    min(
      350px,
      calc(100vw - 28px)
    );

  max-height:
    calc(
      100vh - 90px
    );

  overflow-y: auto;

  display: none;

  padding: 12px;

  color: white;

  background:
    rgba(10,10,10,.80);

  border:
    1px solid
    rgba(255,255,255,.16);

  border-radius: 15px;

  backdrop-filter:
    blur(14px);
}

#menu.open {
  display: block;
}

.sectionTitle {
  margin:
    4px
    0

  font-size: 12px;

  opacity: .68;

  text-transform: uppercase;

  letter-spacing: .08em;
}

.menuGrid {
  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 8px;
}

.menuAction {
  min-height: 42px;

  border:
    1px solid
    rgba(255,255,255,.15);

  border-radius: 10px;

  background:

}

.menuAction.active {

}

.menuAction:active {

}

.worldList {
  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 7px;
}

.worldCard {
  position: relative;

  padding: 0;

  border:
    1px solid

}

.worldCard img {

  height: 100%;

}

  right: 0;

   3D MOVEMENT CONTROLS
===================================================== */

}

/* =====================================================

===================================================== */

/* =====================================================

/* =====================================================

===================================================== */

#errorBox {

  left: 12px;

/* =====================================================

#cameraReference,

<script type="module">

import * as THREE from "three";


/* =====================================================
   WORLD FILES

   These point at the original conversation images.

   The image is then rendered into a 4096 × 2048 canvas
   before Three.js creates the panorama texture.

   If these authenticated ChatGPT URLs are unavailable
   outside ChatGPT, use "Load 360 Image" in the menu.
===================================================== */

const ARCTIC_SOURCE =
  "https://chatgpt.com/backend-api/files/file_0000000008ec820e9ca3e60de29c5ffb/download";


const APARTMENT_SOURCE =
  "https://chatgpt.com/backend-api/files/file_00000000df4c820ebe64df065fd433bd/download";


const MOUNTAIN_SOURCE =
  "https://chatgpt.com/backend-api/files/file_00000000d924820ea8041ed7824665bc/download";


/* =====================================================
   DOM
===================================================== */

const $ =
  id =>
    document.getElementById(
      id
    );


const app =
  $("app");


const menuBtn =
  $("menuBtn");


const menu =
  $("menu");


const coords =
  $("coords");


const loading =
  $("loading");


const errorBox =
  $("errorBox");


const worldList =
  $("worldList");


const moveModeBtn =
  $("moveModeBtn");


const poseModeBtn =
  $("poseModeBtn");


const addDollBtn =
  $("addDollBtn");


const removeDollBtn =
  $("removeDollBtn");


const resetPoseBtn =
  $("resetPoseBtn");


const gridBtn =
  $("gridBtn");


const homeBtn =
  $("homeBtn");


const groundBtn =
  $("groundBtn");


const highBtn =
  $("highBtn");


const localWorldBtn =
  $("localWorldBtn");


const localImagePicker =
  $("localImagePicker");


function showError(
  message
){

  console.error(
    message
  );


  errorBox.style.display =
    "block";


  errorBox.textContent =
    String(
      message
    );

}


function clearError(){

  errorBox.style.display =
    "none";

}


window.addEventListener(

  "error",

  event => {

    if(
      event.message
    ){

      showError(
        event.message
      );

    }

  }

);


window.addEventListener(

  "unhandledrejection",

  event => {

    showError(

      "Unhandled error: "

      +

      (
        event.reason?.message
        ||
        event.reason
        ||
        "unknown"
      )

    );

  }

);


/* =====================================================
   MAIN THREE.JS SCENE
===================================================== */

const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(

    70,

    innerWidth /
    innerHeight,

    .02,

    200

  );


const renderer =
  new THREE.WebGLRenderer({

    antialias:
      true,

    powerPreference:
      "high-performance",

    preserveDrawingBuffer:
      true

  });


renderer.setPixelRatio(

  Math.min(
    devicePixelRatio,
    2
  )

);


renderer.setSize(

  innerWidth,
  innerHeight

);


renderer.outputColorSpace =
  THREE.SRGBColorSpace;


app.appendChild(
  renderer.domElement
);


/* =====================================================
   CAMERA BASE POSITION
===================================================== */

const cameraBase =
  new THREE.Vector3(

    0,

    1.6,

    0

  );


let yaw =
  0;


let pitch =
  0;


let targetFov =
  70;


function constrainCamera(){

  const distance =
    Math.hypot(

      cameraBase.x,

      cameraBase.z

    );


  const radius =
    2.75;


  if(
    distance >
    radius
  ){

    cameraBase.x *=

      radius /
      distance;


    cameraBase.z *=

      radius /
      distance;

  }


  cameraBase.y =
    THREE.MathUtils.clamp(

      cameraBase.y,

      .16,

      3.4

    );

}


/* =====================================================
   WORLDS
===================================================== */

const worlds = [

  {
    id:
      "arctic",

    name:
      "Arctic Base",

    src:
      ARCTIC_SOURCE,

    radius:
      12,

    centerY:
      1.45
  },

  {
    id:
      "apartment",

    name:
      "90s Apartment",

    src:
      APARTMENT_SOURCE,

    radius:
      12,

    centerY:
      1.45
  },

  {
    id:
      "mountains",

    name:
      "Mountains",

    src:
      MOUNTAIN_SOURCE,

    radius:
      18,

    centerY:
      1.45
  }

];


let activeWorld =
  worlds[0];


let worldToken =
  0;


let currentWorldCanvas =
  null;


const environment =
  new THREE.Group();


scene.add(
  environment
);


/* =====================================================
   LOAD IMAGE WITH AUTHENTICATION

   Tries authenticated fetch first.

   This means the normal source PNG can remain sharp
   instead of embedding a tiny compressed thumbnail.
===================================================== */

async function loadImageBitmapFromURL(
  url
){

  const response =
    await fetch(

      url,

      {
        credentials:
          "include",

        cache:
          "force-cache"
      }

    );


  if(
    !response.ok
  ){

    throw new Error(

      `Image request failed: ${response.status}`

    );

  }


  const blob =
    await response.blob();


  return await createImageBitmap(
    blob
  );

}


/* =====================================================
   FORCE ACTIVE WORLD TO 4096 × 2048

   The Three.js texture is actually backed by a
   4096 × 2048 canvas.

   High-quality browser resampling is used when the
   original source resolution differs.
===================================================== */

function build4096PanoramaCanvas(
  image
){

  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    4096;


  canvas.height =
    2048;


  const context =
    canvas.getContext(

      "2d",

      {
        alpha:
          false,

        desynchronized:
          false
      }

    );


  context.imageSmoothingEnabled =
    true;


  context.imageSmoothingQuality =
    "high";


  context.fillStyle =
    "#000";


  context.fillRect(

    0,

    0,

    4096,

    2048

  );


  context.drawImage(

    image,

    0,

    0,

    4096,

    2048

  );


  return canvas;

}


/* =====================================================
   DISPOSE OLD WORLD
===================================================== */

function disposeObject(
  object
){

  object.geometry
    ?.dispose();


  if(
    object.material
  ){

    const materials =

      Array.isArray(
        object.material
      )

      ?

      object.material

      :

      [
        object.material
      ];


    materials.forEach(

      material => {

        material.map
          ?.dispose();


        material.dispose();

      }

    );

  }

}


/* =====================================================
   CORRECT 360 PROJECTION

   THIS IS THE MAPPING THAT WORKED EARLIER:

   ONE full 2:1 equirectangular panorama
   mapped ONCE onto the inside of ONE sphere.

   No cylinder.
   No wall slicing.
   No separate dome.
   No lower band.
===================================================== */

async function installPanorama(
  source,
  world
){

  const token =
    ++worldToken;


  activeWorld =
    world;


  loading.classList.add(
    "visible"
  );


  clearError();


  try {

    let bitmap;


    if(
      typeof source ===
      "string"
    ){

      bitmap =
        await loadImageBitmapFromURL(
          source
        );

    }


    else {

      bitmap =
        await createImageBitmap(
          source
        );

    }


    if(
      token !==
      worldToken
    ){

      bitmap.close?.();

      return;

    }


    const panoramaCanvas =
      build4096PanoramaCanvas(
        bitmap
      );


    bitmap.close?.();


    while(
      environment.children.length
    ){

      const object =
        environment.children[0];


      environment.remove(
        object
      );


      disposeObject(
        object
      );

    }


    currentWorldCanvas =
      panoramaCanvas;


    const texture =
      new THREE.CanvasTexture(
        panoramaCanvas
      );


    texture.colorSpace =
      THREE.SRGBColorSpace;


    texture.wrapS =
      THREE.RepeatWrapping;


    texture.wrapT =
      THREE.ClampToEdgeWrapping;


    /*
    Horizontal flip because the camera sees
    the texture from inside the sphere.
    */

    texture.repeat.set(

      -1,

      1

    );


    texture.offset.set(

      1,

      0

    );


    texture.minFilter =
      THREE.LinearMipmapLinearFilter;


    texture.magFilter =
      THREE.LinearFilter;


    texture.generateMipmaps =
      true;


    texture.anisotropy =
      Math.min(

        8,

        renderer.capabilities
          .getMaxAnisotropy()

      );


    texture.needsUpdate =
      true;


    const sphere =
      new THREE.Mesh(

        new THREE.SphereGeometry(

          world.radius,

          256,

          128

        ),

        new THREE.MeshBasicMaterial({

          map:
            texture,

          side:
            THREE.BackSide

        })

      );


    sphere.position.set(

      0,

      world.centerY,

      0

    );


    sphere.name =
      "Equirectangular360World";


    environment.add(
      sphere
    );


    renderWorldCards();


    clearError();

  }


  catch(
    error
  ){

    showError(

      "Could not load this 360 world. "

      +

      "If you opened the HTML outside ChatGPT, "

      +

      "use Load 360 Image in the hamburger menu. "

      +

      (

        error?.message
        ||
        error

      )

    );

  }


  finally {

    loading.classList.remove(
      "visible"
    );

  }

}


async function loadWorld(
  world
){

  activeWorld =
    world;


  await installPanorama(

    world.src,

    world

  );

}


/* =====================================================
   LOCAL PANORAMA IMPORT FALLBACK
===================================================== */

localWorldBtn.onclick =
  () => {

    localImagePicker.click();

  };


localImagePicker.onchange =
  async event => {

    const file =
      event.target.files?.[0];


    if(
      !file
    ){

      return;

    }


    const customWorld = {

      id:
        "custom",

      name:
        file.name,

      src:
        "",

      radius:
        12,

      centerY:
        1.45

    };


    activeWorld =
      customWorld;


    await installPanorama(

      file,

      customWorld

    );


    event.target.value =
      "";

  };


/* =====================================================
   WORLD THUMBNAILS
===================================================== */

function renderWorldCards(){

  worldList.innerHTML =
    "";


  worlds.forEach(

    world => {

      const button =
        document.createElement(
          "button"
        );


      button.className =

        "worldCard"

        +

        (
          world.id ===
          activeWorld.id

          ?

          " active"

          :

          ""
        );


      const image =
        document.createElement(
          "img"
        );


      image.src =
        world.src;


      image.alt =
        world.name;


      image.referrerPolicy =
        "no-referrer";


      const label =
        document.createElement(
          "span"
        );


      label.textContent =
        world.name;


      button.append(

        image,

        label

      );


      button.onclick =
        async () => {

          await loadWorld(
            world
          );


          cameraBase.set(

            0,

            1.6,

            0

          );


          yaw =
            0;


          pitch =
            0;


          targetFov =
            70;

        };


      worldList.appendChild(
        button
      );

    }

  );

}


/* =====================================================
   CIRCULAR FLOOR GRID
===================================================== */

const GRID_RADIUS =
  3;


const gridGroup =
  new THREE.Group();


scene.add(
  gridGroup
);


const gridMaterial =
  new THREE.LineBasicMaterial({

    color:
      0xffffff,

    transparent:
      true,

    opacity:
      .32

  });


/* concentric circles */

for(
  let radius = .5;
  radius <= GRID_RADIUS;
  radius += .5
){

  const points =
    [];


  for(
    let i = 0;
    i <= 128;
    i++
  ){

    const angle =

      i /
      128 *
      Math.PI *
      2;


    points.push(

      new THREE.Vector3(

        Math.cos(
          angle
        )
        *
        radius,

        .012,

        Math.sin(
          angle
        )
        *
        radius

      )

/* =====================================================
   CREATE WOODEN MANNEQUIN
===================================================== */

function createDoll(
  x = 0,
  z = -2
){

  dollCounter++;


  const root =
    new THREE.Group();


  root.position.set(

    x,

    0,

    z

  );


  root.userData.name =
    `Mannequin ${dollCounter}`;


  scene.add(
    root
  );


  const hips =
    new THREE.Group();


  hips.position.y =
    .95;


  root.add(
    hips
  );


  const pelvis =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        .20,

        .24,

        .30,

        18

      ),

      wood

    );


  hips.add(
    pelvis
  );


  const torsoPivot =
    new THREE.Group();


  torsoPivot.position.y =
    .34;


  hips.add(
    torsoPivot
  );


  const torso =
    new THREE.Mesh(

      new THREE.CylinderGeometry(

        .20,

        .15,

        .55,

        18

      ),

      wood

    );


  torso.position.y =
    .26;


  torsoPivot.add(
    torso
  );


  const neck =
    joint(
      .075
    );


  neck.position.y =
    .60;


  torsoPivot.add(
    neck
  );


  const headPivot =
    new THREE.Group();


  headPivot.position.y =
    .69;


  torsoPivot.add(
    headPivot
  );


  const head =
    new THREE.Mesh(

      new THREE.SphereGeometry(

        .19,

        24,

        18

      ),

      wood

    );


  head.scale.set(

    .85,

    1.08,

    .85

  );


  head.position.y =
    .12;


  headPivot.add(
    head
  );


  function arm(
    side
  ){

    const shoulder =
      new THREE.Group();


    shoulder.position.set(

      side *
      .24,

      .47,

      0

    );


    shoulder.rotation.z =

      side >
      0

      ?

      -.16

      :

      .16;


    torsoPivot.add(
      shoulder
    );


    const shoulderJoint =
      joint(
        .085
      );


    shoulder.add(
      shoulderJoint
    );


    const upper =
      limb(

        .40,

        .07

      );


    shoulder.add(
      upper
    );


    const elbow =
      new THREE.Group();


    elbow.position.y =
      -.40;


    shoulder.add(
      elbow
    );


    const elbowJoint =
      joint(
        .075
      );


    elbow.add(
      elbowJoint
    );


    const lower =
      limb(

        .36,

        .06

      );


    elbow.add(
      lower
    );


    const hand =
      new THREE.Mesh(

        new THREE.SphereGeometry(

          .085,

          16,

          12

        ),

        wood

      );


    hand.scale.set(

      .72,

      1.1,

      .58

    );


    hand.position.y =
      -.40;


    lower.add(
      hand
    );


    [
      shoulderJoint,
      upper
    ]
    .forEach(

      object =>

        object
          .userData
          .poseGroup =

          shoulder

    );


    [
      elbowJoint,
      lower,
      hand
    ]
    .forEach(

      object =>

        object
          .userData
          .poseGroup =

          elbow

    );

  }


  function leg(
    side
  ){

    const hip =
      new THREE.Group();


    hip.position.set(

      side *
      .13,

      -.16,

      0

    );


    hips.add(
      hip
    );


    const hipJoint =
      joint(
        .09
      );


    hip.add(
      hipJoint
    );


    const upper =
      limb(

        .48,

        .085

      );


    hip.add(
      upper
    );


    const knee =
      new THREE.Group();


    knee.position.y =
      -.48;


    hip.add(
      knee
    );


    const kneeJoint =
      joint(
        .08
      );


    knee.add(
      kneeJoint
    );


    const lower =
      limb(

        .46,

        .072

      );


    knee.add(
      lower
    );


    const foot =
      new THREE.Mesh(

        new THREE.BoxGeometry(

          .13,

          .10,

          .28

        ),

        wood

      );


    foot.position.set(

      0,

      -.49,

      .07

    );


    lower.add(
      foot
    );


    [
      hipJoint,
      upper
    ]
    .forEach(

      object =>

        object
          .userData
          .poseGroup =

          hip

    );


    [
      kneeJoint,
      lower,
      foot
    ]
    .forEach(

      object =>

        object
          .userData
          .poseGroup =

          knee

    );

  }


  arm(
    -1
  );


  arm(
    1
  );


  leg(
    -1
  );


  leg(
    1
  );


  root.traverse(

    object => {

      if(
        object.isMesh
      ){

        object.userData.doll =
          root;


        if(
          !object.userData.poseGroup
        ){

          object.userData.poseGroup =

            object ===
            head

            ?

            headPivot

            :

            torsoPivot;

        }


        dollMeshes.push(
          object
        );


        addOutline(
          object
        );

      }

    }

  );


  dolls.push(
    root
  );


  selectDoll(
    root
  );


  return root;

}


/* =====================================================
   REMOVE DOLL
===================================================== */

function removeSelectedDoll(){

  if(
    !selectedDoll
  ){

    return;

  }


  const doll =
    selectedDoll;


  const index =
    dolls.indexOf(
      doll
    );


  if(
    index >= 0
  ){

    dolls.splice(

      index,

      1

    );

  }


  for(
    let i =
      dollMeshes.length -
      1;

    i >= 0;

    i--
  ){

    if(

      dollMeshes[i]
        .userData
        .doll

      ===

      doll

    ){

      dollMeshes.splice(

        i,

        1

      );

    }

  }


  scene.remove(
    doll
  );


  selectedDoll =

    dolls.at(
      -1
    )

    ||

    null;


  if(
    selectedDoll
  ){

    selectDoll(
      selectedDoll
    );

  }

}

/* =====================================================
   RAYCASTING
===================================================== */

const raycaster =
  new THREE.Raycaster();


const pointer =
  new THREE.Vector2();


function updateRay(
  x,
  y
){

  const rect =
    renderer
      .domElement
      .getBoundingClientRect();


  pointer.x =

    (
      (
        x -
        rect.left
      )
      /
      rect.width
    )
    *
    2
    -
    1;


  pointer.y =

    -
    (
      (
        y -
        rect.top
      )
      /
      rect.height
    )
    *
    2
    +
    1;


  raycaster.setFromCamera(

    pointer,

    camera

  );

}


function getDollHit(
  x,
  y
){

  updateRay(
    x,
    y
  );


  return raycaster
    .intersectObjects(

      dollMeshes,

      false

    )[0]

    ||

    null;

}


/* =====================================================
   EDITOR POINTER / TOUCH
===================================================== */

let pointerAction =
  "none";


let poseGroup =
  null;


let lastX =
  0;


let lastY =
  0;


let startX =
  0;


let startY =
  0;


let pointerMoved =
  false;


const carryOffset =
  new THREE.Vector3();


const activePointers =
  new Map();


let pinchStartDistance =
  0;


let pinchStartFov =
  70;


renderer
  .domElement
  .addEventListener(

    "pointerdown",

    event => {

      activePointers.set(

        event.pointerId,

        {

          x:
            event.clientX,

          y:
            event.clientY

        }

      );


      if(
        activePointers.size ===
        2
      ){

        const points =
          [
            ...activePointers.values()
          ];


        pinchStartDistance =
          Math.hypot(

            points[0].x -
            points[1].x,

            points[0].y -
            points[1].y

          );


        pinchStartFov =
          targetFov;


        pointerAction =
          "pinch";


        return;

      }


      lastX =
      startX =
        event.clientX;


      lastY =
      startY =
        event.clientY;


      pointerMoved =
        false;


      /*
      DIRECTOR MODE:
      dolls cannot be edited.
      */

      if(
        directorMode
      ){

        pointerAction =
          "camera";


        renderer
          .domElement
          .setPointerCapture(
            event.pointerId
          );


        return;

      }


      const hit =
        getDollHit(

          event.clientX,

          event.clientY

        );


      if(
        hit
      ){

        const doll =
          hit
            .object
            .userData
            .doll;


        /*
        First tap selects.
        */

        if(
          doll !==
          selectedDoll
        ){

          selectDoll(
            doll
          );


          pointerAction =
            "none";


          return;

        }


        /*
        Second press picks up.
        */

        if(
          dollMode ===
          "move"
        ){

          pointerAction =
            "moveDoll";


          updateRay(

            event.clientX,

            event.clientY

          );


          const floor =
            raycaster
              .intersectObject(

                floorHit,

                false

              )[0];


          if(
            floor
          ){

            carryOffset.set(

              selectedDoll.position.x -
              floor.point.x,

              0,

              selectedDoll.position.z -
              floor.point.z

            );

          }


          selectedDoll.position.y =
            .20;


          renderer
            .domElement
            .setPointerCapture(
              event.pointerId
            );


          return;

        }


        pointerAction =
          "pose";


        poseGroup =
          hit
            .object
            .userData
            .poseGroup;


        renderer
          .domElement
          .setPointerCapture(
            event.pointerId
          );


        return;

      }


      pointerAction =
        "camera";


      renderer
        .domElement
        .setPointerCapture(
          event.pointerId
        );

    }

  );


renderer
  .domElement
  .addEventListener(

    "pointermove",

    event => {

      if(
        activePointers.has(
          event.pointerId
        )
      ){

        activePointers.set(

          event.pointerId,

          {

            x:
              event.clientX,

            y:
              event.clientY

          }

        );

      }


      /* PINCH */

      if(

        activePointers.size ===
        2

        &&

        pinchStartDistance >
        0

      ){

        const points =
          [
            ...activePointers.values()
          ];


        const distance =
          Math.hypot(

            points[0].x -
            points[1].x,

            points[0].y -
            points[1].y

          );


        targetFov =
          THREE.MathUtils.clamp(

            pinchStartFov

            *

            (
              pinchStartDistance
              /
              distance
            ),

            20,

            105

          );


        pointerAction =
          "pinch";


        return;

      }


      const dx =
        event.clientX -
        lastX;


      const dy =
        event.clientY -
        lastY;


      lastX =
        event.clientX;


      lastY =
        event.clientY;


      if(

        Math.hypot(

          event.clientX -
          startX,

          event.clientY -
          startY

        )

        >

        7

      ){

        pointerMoved =
          true;

      }


      if(
        pointerAction ===
        "camera"
      ){

        yaw -=
          dx *
          .004;


        pitch =
          THREE.MathUtils.clamp(

            pitch

            -

            dy *
            .004,

            -Math.PI / 2 +
            .015,

            Math.PI / 2 -
            .015

          );

      }


      else if(

        pointerAction ===
        "moveDoll"

        &&

        selectedDoll

      ){

        updateRay(

          event.clientX,

          event.clientY

        );


        const floor =
          raycaster
            .intersectObject(

              floorHit,

              false

            )[0];


        if(
          floor
        ){

          const x =

            floor.point.x

            +

            carryOffset.x;


          const z =

            floor.point.z

            +

            carryOffset.z;


          if(

            Math.hypot(
              x,
              z
            )

            <=

            GRID_RADIUS -
            .15

          ){

            selectedDoll.position.x =
              x;


            selectedDoll.position.z =
              z;

          }


          selectedDoll.position.y =
            .20;

        }

      }


      else if(

        pointerAction ===
        "pose"

        &&

        poseGroup

      ){

        poseGroup.rotation.z =
          THREE.MathUtils.clamp(

            poseGroup.rotation.z

            +

            dx *
            .012,

            -2.7,

            2.7

          );


        poseGroup.rotation.x =
          THREE.MathUtils.clamp(

            poseGroup.rotation.x

            +

            dy *
            .012,

            -2.5,

            2.5

          );

      }

    }

  );


function finishPointer(
  event
){

  activePointers.delete(
    event.pointerId
  );


  if(
    activePointers.size <
    2
  ){

    pinchStartDistance =
      0;

  }


  if(

    pointerAction ===
    "moveDoll"

    &&

    selectedDoll

  ){

    selectedDoll.position.y =
      0;

  }


  /*
  Tap grid to move camera
  in portrait editor mode.
  */

  else if(

    pointerAction ===
    "camera"

    &&

    !pointerMoved

    &&

    !directorMode

  ){

    updateRay(

      event.clientX,

      event.clientY

    );


    const floor =
      raycaster
        .intersectObject(

          floorHit,

          false

        )[0];


    if(
      floor
    ){

      cameraBase.x =
        floor.point.x;


      cameraBase.z =
        floor.point.z;


      constrainCamera();

    }

  }


  pointerAction =
    "none";


  poseGroup =
    null;


  try {

    renderer
      .domElement
      .releasePointerCapture(
        event.pointerId
      );

  }

  catch(
    error
  ){}

}


renderer
  .domElement
  .addEventListener(

    "pointerup",

    finishPointer

  );


renderer
  .domElement
  .addEventListener(

    "pointercancel",

    finishPointer

  );


renderer
  .domElement
  .addEventListener(

    "wheel",

    event => {

      event.preventDefault();


      targetFov =
        THREE.MathUtils.clamp(

          targetFov

          +

          event.deltaY *
          .03,

          20,

          105

        );

    },

    {
      passive:
        false
    }

  );

function moveRelative(

  forward,

  right,

  vertical = 0

){

  const forwardVector =
    new THREE.Vector3(

      -Math.sin(
        yaw
      ),

      0,

      -Math.cos(
        yaw
      )

    );


  const rightVector =
    new THREE.Vector3(

      Math.cos(
        yaw
      ),

      0,

      -Math.sin(
        yaw
      )

    );


  cameraBase.addScaledVector(

    forwardVector,

    forward

  );


  cameraBase.addScaledVector(

    rightVector,

    right

  );


  cameraBase.y +=
    vertical;


  constrainCamera();

}

function create3DControl(

/* =====================================================
   DEVICE ORIENTATION

   Uses a quaternion so landscape phone rotation works
   more naturally than simply subtracting alpha/beta.
===================================================== */

const deviceQuaternion =
  new THREE.Quaternion();


const zeroDeviceQuaternion =
  new THREE.Quaternion();


const inverseZeroQuaternion =
  new THREE.Quaternion();


const relativeDeviceQuaternion =
  new THREE.Quaternion();


const deviceEuler =
  new THREE.Euler();


const zee =
  new THREE.Vector3(
    0,
    0,
    1
  );


const qScreen =
  new THREE.Quaternion();


const qDeviceCorrection =
  new THREE.Quaternion(

    -Math.sqrt(.5),

    0,

    0,

    Math.sqrt(.5)

  );


let haveDeviceZero =
  false;


function screenOrientationRadians(){

  if(
    screen.orientation
    &&
    typeof screen.orientation.angle ===
    "number"
  ){

    return THREE.MathUtils.degToRad(
      screen.orientation.angle
    );

  }


  return THREE.MathUtils.degToRad(

    window.orientation
    ||
    0

  );

}


function calculateDeviceQuaternion(
  event
){

  const alpha =
    THREE.MathUtils.degToRad(

      event.alpha
      ||
      0

    );


  const beta =
    THREE.MathUtils.degToRad(

      event.beta
      ||
      0

    );


  const gamma =
    THREE.MathUtils.degToRad(

      event.gamma
      ||
      0

    );


  const orient =
    screenOrientationRadians();


  deviceEuler.set(

    beta,

    alpha,

    -gamma,

    "YXZ"

  );


  deviceQuaternion
    .setFromEuler(
      deviceEuler
    );


  deviceQuaternion
    .multiply(
      qDeviceCorrection
    );


  qScreen
    .setFromAxisAngle(

      zee,

      -orient

    );


  deviceQuaternion
    .multiply(
      qScreen
    );


  return deviceQuaternion;

}


window.addEventListener(

  "deviceorientation",

  event => {

    if(
      !directorMode
    ){

      return;

    }


    const quaternion =
      calculateDeviceQuaternion(
        event
      );


    if(
      !haveDeviceZero
    ){

      zeroDeviceQuaternion.copy(
        quaternion
      );


      inverseZeroQuaternion
        .copy(
          zeroDeviceQuaternion
        )
        .invert();


      haveDeviceZero =
        true;

    }


    relativeDeviceQuaternion

      .copy(
        inverseZeroQuaternion
      )

      .multiply(
        quaternion
      );

  },

  true

);


/* =====================================================
   ACCELEROMETER HANDHELD MOTION
===================================================== */

const physicalOffset =
  new THREE.Vector3();


const physicalVelocity =
  new THREE.Vector3();


const physicalRotation =
  new THREE.Vector3();


let lastMotionTime =
  performance.now();


let stepEnergy =
  0;


window.addEventListener(

  "devicemotion",

  event => {

    if(
      !directorMode
    ){

      return;

    }


    const now =
      performance.now();


    const dt =
      Math.min(

        .05,

        Math.max(

          .004,

          (
            now -
            lastMotionTime
          )
          /
          1000

        )

      );


    lastMotionTime =
      now;


    const acceleration =

      event.acceleration

      ||

      null;


    if(
      !acceleration
    ){

      return;

    }


    const ax =
      acceleration.x
      ||
      0;


    const ay =
      acceleration.y
      ||
      0;


    const az =
      acceleration.z
      ||
      0;


    /*
    Micro rotation.
    */

    physicalRotation.x +=

      ay *
      .00040;


    physicalRotation.y +=

      ax *
      .00035;


    physicalRotation.z +=

      ax *
      .00022;


    /*
    Very restrained physical translation.

    It decays quickly because raw phone accelerometers
    cannot provide stable world position indefinitely.
    */

    physicalVelocity.x +=

      ax *
      dt *
      .009;


    physicalVelocity.y +=

      -ay *
      dt *
      .006;


    physicalVelocity.z +=

      -az *
      dt *
      .009;


    const magnitude =
      Math.hypot(

        ax,

        ay,

        az

      );


    if(
      magnitude >
      1.25
    ){

      stepEnergy =
        Math.min(

          1,

          stepEnergy

          +

          magnitude *
          .03

        );

    }

  },

  true

);

const cameraReference =

const cameraFlowCanvas =

      "2d",

          true

let cameraReferenceStream =
  null;


let cameraReferenceActive =
  false;


let previousFlowFrame =
  null;


let opticalX =
  0;


let opticalY =
  0;


let flowCounter =
  0;


async function startCameraReference(){

  if(
    cameraReferenceActive
  ){

    return true;

  }


  if(
    !navigator.mediaDevices
    ?.getUserMedia
  ){

    return false;

  }


  try {

    cameraReferenceStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                "environment"
            },

            width: {
              ideal:
                320
            },

            height: {
              ideal:
                180
            },

            frameRate: {

              ideal:
                30,

              max:
                30

            }

          },

          audio:
            false

        });


    cameraReference.srcObject =
      cameraReferenceStream;


    await cameraReference.play();


    cameraReferenceActive =
      true;


    return true;

  }


  catch(
    error
  ){

    console.warn(

      "Camera reference unavailable. "

      +

      "Recording continues without it.",

      error

    );


    return false;

  }

}


/* =====================================================
   LIGHTWEIGHT OPTICAL MOTION ESTIMATION
===================================================== */

function sampleOpticalMotion(){

  if(

    !cameraReferenceActive

    ||

    cameraReference.readyState <
    2

  ){

    return;

  }


  flowCounter++;


  if(
    flowCounter %
    3 !==
    0
  ){

    return;

  }


  const width =
    cameraFlowCanvas.width;


  const height =
    cameraFlowCanvas.height;


  flowContext.drawImage(

    cameraReference,

    0,

    0,

    width,

    height

  );


  const pixels =
    flowContext
      .getImageData(

        0,

        0,

        width,

        height

      )
      .data;


  const frame =
    new Uint8Array(

      width *
      height

    );


  for(

    let i = 0,
        j = 0;

    i < pixels.length;

    i += 4,
    j++

  ){

    frame[j] =

      (
        pixels[i] *
        3

        +

        pixels[i + 1] *
        6

        +

        pixels[i + 2]

      )

      /

      10;

  }


  if(
    previousFlowFrame
  ){

    let bestScore =
      Infinity;


    let bestX =
      0;


    let bestY =
      0;


    for(
      let offsetY = -3;
      offsetY <= 3;
      offsetY++
    ){

      for(
        let offsetX = -4;
        offsetX <= 4;
        offsetX++
      ){

        let score =
          0;


        let samples =
          0;


        for(
          let y = 8;
          y < height - 8;
          y += 5
        ){

          for(
            let x = 8;
            x < width - 8;
            x += 5
          ){

            const a =

              frame[
                y *
                width +
                x
              ];


            const b =

              previousFlowFrame[

                (
                  y +
                  offsetY
                )
                *
                width

                +

                (
                  x +
                  offsetX
                )

              ];


            score +=

              Math.abs(
                a - b
              );


            samples++;

          }

        }


        score /=

          Math.max(
            1,
            samples
          );


        if(
          score <
          bestScore
        ){

          bestScore =
            score;


          bestX =
            offsetX;


          bestY =
            offsetY;

        }

      }

    }


    opticalX =
      THREE.MathUtils.lerp(

        opticalX,

        bestX,

        .15

      );


    opticalY =
      THREE.MathUtils.lerp(

        opticalY,

        bestY,

        .15

      );

  }


  previousFlowFrame =
    frame;

}

function recorderSupported(){

  return !!(

    window.MediaRecorder

    &&

    renderer
      .domElement
      .captureStream

  );

}


function bestRecordingMime(){

  const types = [

    "video/webm;codecs=vp9",

    "video/webm;codecs=vp8",

    "video/webm",

    "video/mp4"

  ];


  for(
    const type
    of
    types
  ){

    try {

      if(
        MediaRecorder
          .isTypeSupported(
            type
          )
      ){

        return type;

      }

    }


    catch(
      error
    ){}

  }


  return "";

}


/* =====================================================
   START RECORDING
===================================================== */

async function startRecording(){

  if(
    recording
  ){

    return;

  }


  clearError();


  if(
    !recorderSupported()
  ){

    showError(

      "This browser does not support WebGL canvas recording. "

      +

      "Use a current Chrome/Chromium browser on Android."

    );


    return;

  }


  await requestSensors();


  /*
  Camera-reference access is optional.
  Never let it prevent video recording.
  */

  startCameraReference()
    .catch(
      () => {}
    );


  haveDeviceZero =
    false;


  physicalOffset.set(

    0,

    0,

    0

  );


  physicalVelocity.set(

    0,

    0,

    0

  );


  physicalRotation.set(

    0,

    0,

    0

  );


  opticalX =
    0;


  opticalY =
    0;


  previousFlowFrame =
    null;


  let stream;


  try {

    stream =
      renderer
        .domElement
        .captureStream(
          60
        );

  }


  catch(
    error
  ){

    try {

      stream =
        renderer
          .domElement
          .captureStream(
            30
          );

    }


    catch(
      secondError
    ){

      showError(

        "The browser could not capture the Three.js canvas."

      );


      return;

    }

  }


  const mime =
    bestRecordingMime();


  try {

    const options = {

      videoBitsPerSecond:
        16000000

    };


    if(
      mime
    ){

      options.mimeType =
        mime;

    }


    mediaRecorder =
      new MediaRecorder(

        stream,

        options

      );

  }


  catch(
    error
  ){

    try {

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    catch(
      secondError
    ){

      showError(

        "MediaRecorder could not start: "

        +

        (
          secondError?.message
          ||
          secondError
        )

      );


      return;

    }

  }


  recordedParts =
    [];


  mediaRecorder
    .ondataavailable =
    event => {

      if(

        event.data

        &&

        event.data.size >
        0

      ){

        recordedParts.push(
          event.data
        );

      }

    };


  mediaRecorder
    .onerror =
    event => {

      showError(

        "Recording error: "

        +

        (
          event.error?.message
          ||
          "unknown MediaRecorder error"
        )

      );

    };


  mediaRecorder
    .onstop =
    () => {

      if(
        !recordedParts.length
      ){

        showError(

          "Recording stopped, but the browser returned no video data."

        );


        return;

      }


      recordedVideo =
        new Blob(

          recordedParts,

          {

            type:

              mediaRecorder.mimeType

              ||

              mime

              ||

              "video/webm"

          }

        );


      if(
        recordingURL
      ){

        URL.revokeObjectURL(
          recordingURL
        );

      }


      recordingURL =
        URL.createObjectURL(
          recordedVideo
        );


      previewVideo.src =
        recordingURL;


      previewVideo.load();


      previewPanel
        .classList
        .add(
          "open"
        );

    };


  try {

    /*
    Emit chunks every 200 ms so a long take does not
    exist as one enormous in-memory MediaRecorder chunk.
    */

    mediaRecorder.start(
      200
    );

  }


  catch(
    error
  ){

    showError(

      "Recording failed to start: "

      +

      (
        error?.message
        ||
        error
      )

    );


    return;

  }


  recording =
    true;


  recordBtn
    .classList
    .add(
      "recording"
    );


  recordStatus.textContent =
    "STOP";

}


/* =====================================================
   STOP RECORDING
===================================================== */

function stopRecording(){

  if(
    !recording
  ){

    return;

  }


  recording =
    false;


  recordBtn
    .classList
    .remove(
      "recording"
    );


  recordStatus.textContent =
    "REC";


  if(

    mediaRecorder

    &&

    mediaRecorder.state !==
    "inactive"

  ){

    try {

      mediaRecorder.requestData();

    }

    catch(
      error
    ){}


    setTimeout(

      () => {

        try {

          if(
            mediaRecorder.state !==
            "inactive"
          ){

            mediaRecorder.stop();

          }

        }

        catch(
          error
        ){}

      },

      80

    );

  }

}

/* =====================================================
   DIRECTOR CAMERA MOTION
===================================================== */

const baseRotation =
  new THREE.Quaternion();


const finalRotation =
  new THREE.Quaternion();


const baseEuler =
  new THREE.Euler();


function updateDirectorCamera(
  dt
){

  sampleOpticalMotion();


  /*
  Decay translational velocity rapidly.

  This lets real hand/step motion influence the shot
  without allowing raw accelerometer drift to run away.
  */

  physicalVelocity
    .multiplyScalar(

      Math.pow(
        .08,
        dt
      )

    );


  physicalOffset
    .addScaledVector(

      physicalVelocity,

      dt *
      1.5

    );


  physicalOffset
    .multiplyScalar(

      Math.pow(
        .08,
        dt
      )

    );


  physicalRotation
    .multiplyScalar(

      Math.pow(
        .03,
        dt
      )

    );


  /*
  Hidden phone-camera movement provides a second,
  tiny movement reference.
  */

  physicalOffset.x +=

    opticalX *
    .0001;


  physicalOffset.y +=

    opticalY *
    .00007;


  /*
  Footstep energy produces restrained body bob.
  */

  stepEnergy *=

    Math.pow(
      .15,
      dt
    );


  const bob =

    Math.sin(

      performance.now() *
      .012

    )

    *

    stepEnergy

    *

    .022;


  camera.position.copy(
    cameraBase
  );


  camera.position.add(
    physicalOffset
  );


  camera.position.y +=
    bob;


  /*
  User's editor framing becomes the base orientation.
  */

  baseEuler.set(

    pitch +
    physicalRotation.x,

    yaw +
    physicalRotation.y,

    physicalRotation.z,

    "YXZ"

  );


  baseRotation
    .setFromEuler(
      baseEuler
    );


  /*
  Apply real phone rotation relative to the orientation
  present when recording began.
  */

  finalRotation
    .copy(
      baseRotation
    );


  if(
    haveDeviceZero
  ){

    finalRotation.multiply(
      relativeDeviceQuaternion
    );

  }


  /*
  Tiny optical-flow roll correction.
  */

  const opticalRoll =
    THREE.MathUtils.clamp(

      -opticalX *
      .00035,

      -.03,

      .03

    );


  if(
    opticalRoll !==
    0
  ){

    finalRotation.multiply(

      new THREE.Quaternion()
        .setFromAxisAngle(

          new THREE.Vector3(
            0,
            0,
            1
          ),

          opticalRoll

        )

    );

  }


  camera.quaternion.copy(
    finalRotation
  );

}


/* =====================================================
   STATUS
===================================================== */

function updateStatus(){

  coords.innerHTML =

    `World: ${activeWorld.name}<br>`

    +

    `Texture: 4096 × 2048<br>`

    +

    `Camera: `

    +

    `${cameraBase.x.toFixed(2)}, `

    +

    `${cameraBase.y.toFixed(2)}, `

    +

    `${cameraBase.z.toFixed(2)}<br>`

    +

    `FOV: ${Math.round(camera.fov)}°<br>`

    +

    `Dolls: ${dolls.length}<br>`

    +

    `Selected: `

    +

    `${
      selectedDoll
      ?
      selectedDoll.userData.name
      :
      "none"
    }`;

}


/* =====================================================
   RENDER LOOP
===================================================== */

let previousFrame =
  performance.now();


function animate(){

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();


  const dt =
    Math.min(

      .05,

      Math.max(

        .001,

        (
          now -
          previousFrame
        )
        /
        1000

      )

    );


  previousFrame =
    now;


  if(
    heldControl
  ){

    performControl(
      heldControl
    );

  }


  camera.fov +=

    (
      targetFov -
      camera.fov
    )

    *

    .13;


  camera.updateProjectionMatrix();


  if(
    directorMode
  ){

    updateDirectorCamera(
      dt
    );

  }


  else {

    camera.position.copy(
      cameraBase
    );


    camera.rotation.order =
      "YXZ";


    camera.rotation.y =
      yaw;


    camera.rotation.x =
      pitch;


    camera.rotation.z =
      0;

  }


  updateStatus();


  renderer.render(

    scene,

    camera

  );


  controlRenderer.render(

    controlScene,

    controlCamera

  );

}


animate();


/* =====================================================
   RESIZE / PHONE ROTATION
===================================================== */

function resize(){

  camera.aspect =

    innerWidth /
    innerHeight;


  camera.updateProjectionMatrix();


  renderer.setSize(

    innerWidth,

    innerHeight

  );


  renderer.setPixelRatio(

    Math.min(

      devicePixelRatio,

      2

    )

  );


  const wasDirector =
    directorMode;


  updateInterfaceMode();


  /*
  Re-zero real phone orientation whenever landscape
  Director mode begins.
  */

  if(

    directorMode

    &&

    !wasDirector

  ){

    haveDeviceZero =
      false;

  }


  /*
  Returning to portrait immediately restores Editor mode.

  If recording is active, finish the take first.
  */

  if(

    !directorMode

    &&

    recording

  ){

    stopRecording();

  }

}


window.addEventListener(

  "resize",

  resize

);


screen.orientation
  ?.addEventListener
  ?.(
    "change",

    resize
  );


/* =====================================================
   BOOT
===================================================== */

renderWorldCards();


await loadWorld(
  worlds[0]
);

</script>

</body>
</html>
