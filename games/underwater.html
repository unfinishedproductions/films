<script type="module">

/*
    Aurelia underwater isolation
    --------------------------------

    Retained conceptually from Aurelia:

        src/app.js
        src/background.js
        src/lights.js
        src/plankton.js
        src/godrays.js

    Completely removed:

        Medusa
        MedusaBell
        MedusaBellBottom
        MedusaBellFormula
        MedusaBellGeometry
        MedusaBellMargin
        MedusaBellPattern
        MedusaBellTop
        MedusaOralArms
        MedusaTentacles
        MedusaVerletBridge
        VerletPhysics
        VertexVisualizer
        SpringVisualizer
        tweakpane/debug UI

    The only object left in the water is one sphere.

    Three.js version intentionally matches Aurelia:
        0.175.0
*/

import * as THREE from "three/webgpu";

import {
    Fn,
    vec2,
    vec3,
    vec4,
    float,
    uint,

    uniform,
    varying,
    attribute,

    positionWorld,
    positionView,
    positionLocal,
    normalWorld,
    cameraPosition,
    cameraViewMatrix,
    cameraWorldMatrix,
    cameraFar,
    screenUV,

    time,
    sin,
    dot,
    mod,
    min,
    mix,
    smoothstep,
    mat3,

    Loop,
    If,

    instanceIndex,
    billboarding,

    uv,

    triNoise3D,
    mx_noise_vec3

} from "three/tsl";

import { OrbitControls } from
    "three/addons/controls/OrbitControls.js";


/* ============================================================
   ERROR
   ============================================================ */

const errorElement = document.querySelector("#error");

function showError(message) {

    console.error(message);

    errorElement.style.display = "block";
    errorElement.textContent = message;

}


/* ============================================================
   LIGHTS
   ============================================================

   This is Aurelia's light configuration.

   lights.js:

       lightDir = new Vector3(0,300,0)
           .multiplyScalar(-1)
           .normalize()

       DirectionalLight(0xffffff, 2)

       HemisphereLight(
           0xffffff,
           Color(.1,.4,.9),
           1
       )
   ============================================================ */

class OceanLights {

    static lightDir = new THREE.Vector3(
        0,
        300,
        0
    )
    .multiplyScalar(-1)
    .normalize();


    constructor() {

        this.object = new THREE.Object3D();


        this.directional = new THREE.DirectionalLight(
            0xffffff,
            2.0
        );

        this.directional.position.set(
            100,
            300,
            0
        );

        this.object.add(
            this.directional
        );


        this.ambient = new THREE.HemisphereLight(

            0xffffff,

            new THREE.Color(
                0.1,
                0.4,
                0.9
            ),

            1.0

        );

        this.object.add(
            this.ambient
        );

    }

}


/* ============================================================
   BACKGROUND / UNDERWATER VOLUME
   ============================================================

   Adapted directly from Aurelia background.js.

   Important:

   The apparent "water" surrounding the viewer is NOT an
   ordinary Three.js Fog object.

   Aurelia evaluates a procedural function based on the
   camera ray direction.

   Looking upward produces substantially more blue illumination.
   Looking downward falls away toward darkness.
   ============================================================ */


const hash23 = Fn(([uvIn]) => {

    const a = 12.9898;
    const b = 78.233;

    const c = vec3(
        43758.5453,
        43758.1947,
        43758.42037
    );

    const dt = dot(
        uvIn.xy,
        vec2(a, b)
    );

    const sinsn = sin(
        mod(
            dt,
            Math.PI
        )
    ).toVar();

    return c
        .mul(sinsn)
        .fract();

});


class OceanBackground {

    static fogNear = 12;
    static fogFar  = 30;


    /*
        Aurelia background/fog shader.
    */

    static fogFunction = Fn(() => {

        const rayDir = positionWorld
            .xyz
            .sub(cameraPosition.xyz)
            .normalize();


        const value = float(0)
            .toVar();


        const uvRay = vec3(

            rayDir
                .xz
                .normalize()
                .mul(3),

            0.0

        ).toVar();


        const initialRayOffset = mix(

            rayDir.xz,

            uvRay.xy,

            0.5

        );


        const p = vec3(

            cameraPosition
                .xz
                .add(
                    initialRayOffset.mul(3.0)
                ),

            rayDir.y.mul(2)

        ).toVar();


        const factor = 0.005;


        p.mulAssign(
            factor
        );

        uvRay.mulAssign(
            factor
        );


        Loop(5, () => {

            const noise = triNoise3D(
                p,
                0.2,
                time
            );

            value.addAssign(
                noise
            );

            p.addAssign(
                uvRay
            );

        });


        value.divAssign(5);

        value.mulAssign(
            1.3
        );


        /*
            This is the important up/down gradient.

            rayDir.y = +1
                bright upper ocean

            rayDir.y = -1
                dark lower ocean
        */

        const y = rayDir.y
            .mul(0.5)
            .add(0.5);


        const colorTop = vec3(
            0.1,
            0.4,
            0.9
        );


        const color = colorTop
            .mul(y)
            .mul(value)
            .toVar();


        /*
            Original 8-bit dithering.
        */

        const dither = hash23(
            screenUV
        )
        .sub(0.5)
        .mul(
            1.0 / 255.0
        );


        color.xyz.addAssign(
            dither
        );


        return color;

    })();


    /*
        Aurelia's distance fade for objects in the water.
    */

    static getFog = Fn(() => {

        const projectedZ = positionView.z
            .mul(-1);


        return smoothstep(

            OceanBackground.fogNear,

            OceanBackground.fogFar,

            projectedZ

        ).oneMinus();

    })();


    /*
        Procedural animated water illumination.

        This is what produces moving bright water-like
        reflections on upward-facing geometry.
    */

    static envFunction = Fn(() => {

        const up = normalWorld.y.max(
            0.0
        );


        const lightIntensity = float(
            0.0
        ).toVar();


        If(
            up.greaterThan(0.0),

            () => {

                const matrix = mat3(

                    -2/3, -1/3,  2/3,
                     3/3, -2/3,  1/3,
                     1/3,  2/3,  2/3

                );


                const water = vec3(

                    positionWorld
                        .xz
                        .mul(1.5),

                    time.mul(0.5)

                ).toVar();


                water.assign(

                    matrix.mul(
                        water
                    )

                );


                const a = vec3(0.5)

                    .sub(
                        water.fract()
                    )

                    .length()

                    .toVar();


                water.assign(

                    matrix.mul(
                        water
                    )

                );


                a.assign(

                    min(

                        a,

                        vec3(0.5)

                            .sub(
                                water.fract()
                            )

                            .length()

                    )

                );


                lightIntensity.assign(

                    up

                    .mul(

                        a
                        .add(0.4)
                        .pow(8.0)
                        .mul(4.0)
                        .max(0.0)

                    )

                );

            }
        );


        return vec3(1)
            .mul(
                lightIntensity
            );

    })();

}


/* ============================================================
   PLANKTON
   ============================================================

   Adapted from Aurelia plankton.js.

   This is environmental ocean code, so it stays.

   Particles are procedurally distributed around the camera,
   slowly distorted by GPU noise, faded using the exact same
   underwater fog range and softly billboarded.
   ============================================================ */


const triple32 = Fn(([xImmutable]) => {

    const x = uint(
        xImmutable
    ).toVar();


    x.bitXorAssign(
        x.shiftRight(
            uint(17)
        )
    );


    x.mulAssign(
        uint(0xed5ad4bb)
    );


    x.bitXorAssign(
        x.shiftRight(
            uint(11)
        )
    );


    x.mulAssign(
        uint(0xac4c1b51)
    );


    x.bitXorAssign(
        x.shiftRight(
            uint(15)
        )
    );


    x.mulAssign(
        uint(0x31848bab)
    );


    x.bitXorAssign(
        x.shiftRight(
            uint(14)
        )
    );


    return x;

}).setLayout({

    name: "triple32",

    type: "uint",

    inputs: [
        {
            name: "x",
            type: "uint"
        }
    ]

});


const hash = Fn(([xImmutable]) => {

    const x = uint(
        xImmutable
    ).toVar();


    return float(
        triple32(x)
    ).div(

        float(
            uint(0xffffffff)
        )

    );

}).setLayout({

    name: "hash",

    type: "float",

    inputs: [
        {
            name: "x",
            type: "uint"
        }
    ]

});


class Plankton {

    constructor() {

        this.uniforms = {

            bounds: uniform(
                20,
                "float"
            )

        };


        this.material =
            new THREE.MeshBasicNodeMaterial({

                lights: false,

                transparent: true,

                depthWrite: false,

                fog: false,

                side: THREE.DoubleSide

            });


        const fog = varying(

            float(0),

            "vPlanktonFog"

        );


        const flickering = varying(

            float(0),

            "vPlanktonFlickering"

        );


        this.material.vertexNode = Fn(() => {

            const id = instanceIndex
                .mul(4)
                .add(1)
                .toVar();


            const pos = vec3(

                hash(id),

                hash(
                    id.add(1)
                ),

                hash(
                    id.add(2)
                )

            )
            .mul(
                this.uniforms.bounds
            )
            .toVar();


            const noise =
                mx_noise_vec3(

                    vec3(

                        pos.xy,

                        time.mul(0.1)

                    )

                )
                .toVar();


            pos.addAssign(
                noise
            );


            /*
                Keep particle volume centred around camera.
            */

            const cameraCenterPos =

                cameraWorldMatrix

                .mul(

                    vec4(

                        0.0,
                        0.0,

                        cameraFar.mul(-0.5),

                        1.0

                    )

                )

                .xyz;


            const offset =

                pos

                .sub(
                    cameraCenterPos
                )

                .div(
                    this.uniforms.bounds
                )

                .round()

                .mul(
                    this.uniforms.bounds
                )

                .mul(-1);


            pos.addAssign(
                offset
            );


            const projectedZ =

                cameraViewMatrix

                .mul(

                    vec4(
                        pos,
                        1.0
                    )

                )

                .z

                .mul(-1);


            fog.assign(

                smoothstep(

                    OceanBackground.fogNear,

                    OceanBackground.fogFar,

                    projectedZ

                )

                .oneMinus()

            );


            fog.mulAssign(

                smoothstep(

                    1,

                    3,

                    projectedZ

                )

            );


            flickering.assign(

                triNoise3D(

                    vec3(

                        float(
                            instanceIndex
                        ),

                        13.12,

                        13.37

                    ),

                    0.5,

                    time

                )

            );


            positionLocal.xy.mulAssign(

                hash(
                    id.add(3)
                )

                .mul(0.8)

                .add(0.6)

            );


            return billboarding({

                position: pos,

                horizontal: true,

                vertical: true

            });

        })();


        this.material.colorNode =
            vec3(
                1,
                1,
                1
            );


        this.material.opacityNode =
            Fn(() => {

                const vUv = uv()

                    .mul(2.0)

                    .sub(1.0);


                const opacity =

                    vUv

                    .length()

                    .oneMinus()

                    .max(0.0)

                    .pow(3.0)

                    .mul(fog)

                    .mul(0.2);


                opacity.mulAssign(
                    flickering
                );


                return opacity;

            })();


        const plane =
            new THREE.PlaneGeometry(
                0.1,
                0.1
            );


        this.geometry =
            new THREE.InstancedBufferGeometry()
                .copy(plane);


        this.geometry.instanceCount =
            1000;


        this.object =
            new THREE.Mesh(

                this.geometry,

                this.material

            );


        this.object.frustumCulled =
            false;


        /*
            Directly follows Aurelia's camera-dependent
            plankton density calculation.
        */

        this.object.onBeforeRender =
            (
                renderer,
                scene,
                camera
            ) => {

                const minBounds =
                    new THREE.Vector3();

                const maxBounds =
                    new THREE.Vector3();


                camera.getViewBounds(

                    camera.far,

                    minBounds,

                    maxBounds

                );


                const bounds = maxBounds

                    .sub(minBounds)

                    .setZ(
                        camera.far
                    )

                    .length();


                this.uniforms.bounds.value =
                    bounds;


                const volume =
                    bounds *
                    bounds *
                    bounds;


                this.geometry.instanceCount =

                    Math.min(

                        6000,

                        Math.floor(
                            volume * 0.02
                        )

                    );

            };


        this.object.renderOrder =
            100;

    }

}


/* ============================================================
   CENTRAL SPHERE
   ============================================================ */


class FloatingSphere {

    constructor() {

        /*
            High enough subdivision for smooth silhouette.
        */

        this.geometry =
            new THREE.SphereGeometry(

                1.55,

                96,

                64

            );


        /*
            Aurelia's bell material defaults:

                roughness     0.4
                metalness     0.2
                transmission  0.7
                opacity       0.7
                transparent   true

            We retain those physical parameters but remove
            every medusa-specific bell-pattern calculation.
        */

        this.material =
            new THREE.MeshPhysicalNodeMaterial({

                color:
                    new THREE.Color(
                        0xeef8ff
                    ),

                roughness:
                    0.4,

                metalness:
                    0.2,

                transmission:
                    0.7,

                thickness:
                    1.4,

                ior:
                    1.33,

                opacity:
                    0.82,

                transparent:
                    true,

                side:
                    THREE.DoubleSide

            });


        /*
            Let Aurelia's animated underwater environment
            illuminate the sphere.

            This is the key to it reacting to the moving
            "surface light" instead of just being a flat
            Three.js ball.
        */

        this.material.envNode =
            OceanBackground.envFunction;


        /*
            Fade the sphere naturally into the same
            underwater depth volume.
        */

        this.material.opacityNode =
            Fn(() => {

                const fog =
                    OceanBackground.getFog;

                return float(0.82)
                    .mul(fog);

            })();


        this.object =
            new THREE.Mesh(

                this.geometry,

                this.material

            );


        this.object.position.set(
            0,
            0,
            0
        );


        this.object.renderOrder =
            10;

    }

}


/* ============================================================
   SPHERE VOLUMETRIC SHADOW
   ============================================================

   Aurelia's godrays.js does NOT use a conventional shadow map.

   The jellyfish generates low-opacity dark geometry which is
   extended along the light vector.

   Here the medusa-specific bell formula is removed.

   Instead, the same concept begins at the silhouette of our
   sphere and extends downward along Aurelia's lightDir.

   The result is a soft underwater shadow/occlusion shaft.
   ============================================================ */


class SphereGodrays {

    constructor(
        sphereRadius = 1.55
    ) {

        this.radius =
            sphereRadius;


        this.buildGeometry();

        this.buildMaterial();


        this.object =
            new THREE.Mesh(

                this.geometry,

                this.material

            );


        this.object.frustumCulled =
            false;


        this.object.renderOrder =
            -1;

    }


    buildGeometry() {

        const resolution =
            28;


        const positions = [];

        const params = [];

        const indices = [];


        /*
            param.x = horizontal silhouette coordinate -1..1
            param.y = extrusion offset 0..1
        */


        for (
            let x = 0;
            x <= resolution;
            x++
        ) {

            const sx =
                x / resolution * 2 - 1;


            /*
                top edge
            */

            positions.push(
                0,
                0,
                0
            );

            params.push(
                sx,
                0,
                0
            );


            /*
                bottom edge
            */

            positions.push(
                0,
                0,
                0
            );

            params.push(
                sx,
                1,
                0
            );

        }


        for (
            let x = 0;
            x < resolution;
            x++
        ) {

            const a =
                x * 2;

            const b =
                a + 1;

            const c =
                a + 2;

            const d =
                a + 3;


            indices.push(
                a,
                b,
                c
            );

            indices.push(
                c,
                b,
                d
            );

        }


        this.geometry =
            new THREE.BufferGeometry();


        this.geometry.setAttribute(

            "position",

            new THREE.Float32BufferAttribute(

                positions,

                3

            )

        );


        this.geometry.setAttribute(

            "rayParams",

            new THREE.Float32BufferAttribute(

                params,

                3

            )

        );


        this.geometry.setIndex(
            indices
        );

    }


    buildMaterial() {

        this.material =
            new THREE.MeshBasicNodeMaterial({

                color:
                    0x000000,

                transparent:
                    true,

                depthWrite:
                    false,

                depthTest:
                    true,

                fog:
                    false,

                side:
                    THREE.DoubleSide

            });


        const radius =
            uniform(
                this.radius
            );


        const lightDir =
            uniform(
                OceanLights.lightDir
            );


        const vOffset =
            varying(

                float(0),

                "vSphereRayOffset"

            );


        const vAcross =
            varying(

                float(0),

                "vSphereRayAcross"

            );


        this.material.positionNode =
            Fn(() => {

                const p =
                    attribute(
                        "rayParams"
                    );


                const across =
                    p.x;


                const offset =
                    p.y;


                /*
                    Horizontal camera direction.

                    This keeps the shadow volume visually
                    aligned with the sphere silhouette as
                    the viewer orbits around it.
                */

                const cameraDir =
                    cameraPosition

                    .xyz

                    .normalize();


                const up =
                    vec3(
                        0,
                        1,
                        0
                    );


                const tangent =
                    up

                    .cross(
                        cameraDir
                    )

                    .normalize();


                /*
                    Reconstruct the visible circular
                    silhouette of the sphere.

                    x = across * radius

                    z/depth follows circle equation:
                    sqrt(r² - x²)
                */

                const x =
                    across.mul(
                        radius
                    );


                const depth =
                    float(1)

                    .sub(

                        across
                        .mul(across)

                    )

                    .max(0)

                    .sqrt()

                    .mul(
                        radius
                    );


                const silhouette =
                    tangent

                    .mul(x)

                    .add(

                        cameraDir

                        .mul(
                            depth * 0.18
                        )

                    )

                    .toVar();


                /*
                    Start slightly behind the sphere.
                */

                silhouette.addAssign(

                    cameraDir.mul(
                        -0.16
                    )

                );


                /*
                    Same essential Aurelia godray idea:

                        position +=
                            lightDir *
                            offset *
                            20
                */

                silhouette.addAssign(

                    lightDir

                    .mul(offset)

                    .mul(20)

                );


                vOffset.assign(
                    offset
                );


                vAcross.assign(
                    across
                );


                return silhouette;

            })();


        this.material.opacityNode =
            Fn(() => {

                /*
                    Soft circular sides.
                */

                const silhouetteFade =

                    float(1)

                    .sub(

                        vAcross
                        .abs()

                        .pow(4)

                    )

                    .max(0);


                /*
                    Aurelia godrays fade in at the source,
                    then gradually vanish along their length.
                */

                const sourceFade =

                    smoothstep(

                        0.00,

                        0.045,

                        vOffset

                    );


                const distanceFade =

                    vOffset
                    .oneMinus();


                /*
                    Reuse Aurelia's underwater distance
                    fog behavior.
                */

                const fog =

                    smoothstep(

                        OceanBackground.fogNear,

                        OceanBackground.fogFar,

                        positionView.z.mul(-1)

                    )

                    .oneMinus()

                    .toVar();


                fog.mulAssign(

                    smoothstep(

                        1,

                        3,

                        positionView.z.mul(-1)

                    )

                );


                return silhouetteFade

                    .mul(
                        sourceFade
                    )

                    .mul(
                        distanceFade
                    )

                    .mul(fog)

                    /*
                        Original Aurelia ray geometry is
                        deliberately extremely subtle.
                    */
                    .mul(
                        0.14
                    );

            })();

    }

}


/* ============================================================
   APP
   ============================================================ */


class App {

    constructor(
        renderer
    ) {

        this.renderer =
            renderer;

    }


    async init() {

        /*
            Aurelia camera:
                FOV 65
                near .01
                far 30
                camera 0,0,15
        */

        this.camera =
            new THREE.PerspectiveCamera(

                65,

                innerWidth / innerHeight,

                0.01,

                30

            );


        this.camera.position.set(
            0,
            0,
            15
        );


        this.camera.lookAt(
            0,
            0,
            0
        );


        this.camera.updateProjectionMatrix();


        this.scene =
            new THREE.Scene();


        this.scene.background =
            new THREE.Color(
                0x000000
            );


        /*
            Exact Aurelia procedural background.
        */

        this.scene.backgroundNode =
            OceanBackground.fogFunction;


        /*
            Exact Aurelia procedural water illumination.
        */

        this.scene.environmentNode =
            OceanBackground.envFunction;


        this.scene.environmentIntensity =
            0.3;


        /*
            Original tone mapping.
        */

        this.renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        this.renderer.toneMappingExposure =
            1.0;


        /*
            Controls are intentionally kept because the
            original viewer is designed around looking
            around the underwater volume.

            Pan disabled just like Aurelia.
        */

        this.controls =
            new OrbitControls(

                this.camera,

                this.renderer.domElement

            );


        this.controls.enableDamping =
            true;


        /*
            IMPORTANT DIFFERENCE:

            Aurelia clamps vertical orbit because its
            composition is centred around jellyfish.

            Your request specifically asks to look UP
            toward the light AND DOWN into the depth,
            therefore we intentionally expose the full
            vertical underwater sphere.
        */

        this.controls.minPolarAngle =
            0.001;


        this.controls.maxPolarAngle =
            Math.PI - 0.001;


        this.controls.minDistance =
            7;


        this.controls.maxDistance =
            25;


        this.controls.enablePan =
            false;


        /*
            Lights.
        */

        this.lights =
            new OceanLights();


        this.scene.add(
            this.lights.object
        );


        /*
            Only actual foreground object.
        */

        this.sphere =
            new FloatingSphere();


        this.scene.add(
            this.sphere.object
        );


        /*
            Its underwater light occlusion / godray shadow.
        */

        this.sphereGodrays =
            new SphereGodrays(
                1.55
            );


        this.scene.add(
            this.sphereGodrays.object
        );


        /*
            Ocean particulate layer.
        */

        this.plankton =
            new Plankton();


        this.scene.add(
            this.plankton.object
        );


        /*
            Give the sphere an almost imperceptible
            zero-gravity drift without changing its
            central placement.

            This affects only its transform, not the water.
        */

        this.baseSphereY =
            0;

    }


    resize(
        width,
        height
    ) {

        this.camera.aspect =
            width / height;


        this.camera.updateProjectionMatrix();

    }


    async update(
        delta,
        elapsed
    ) {

        this.controls.update(
            delta
        );


        /*
            Very small floating motion.

            Delete these three lines if you need the ball
            mathematically stationary.
        */

        const floatY =
            Math.sin(
                elapsed * 0.42
            ) * 0.06;


        this.sphere.object.position.y =
            this.baseSphereY + floatY;


        this.sphereGodrays.object.position.y =
            this.baseSphereY + floatY;


        await this.renderer.renderAsync(

            this.scene,

            this.camera

        );

    }

}


/* ============================================================
   RENDERER
   ============================================================ */


async function run() {

    if (
        !navigator.gpu
    ) {

        showError(
            "WebGPU is not available on this browser/device."
        );

        return;

    }


    const renderer =
        new THREE.WebGPURenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    document
        .querySelector("#container")
        .appendChild(
            renderer.domElement
        );


    await renderer.init();


    if (
        !renderer.backend.isWebGPUBackend
    ) {

        showError(
            "Three.js could not initialize its WebGPU backend."
        );

        return;

    }


    const app =
        new App(
            renderer
        );


    await app.init();


    window.addEventListener(

        "resize",

        () => {

            const width =
                window.innerWidth;

            const height =
                window.innerHeight;


            renderer.setSize(
                width,
                height
            );


            app.resize(
                width,
                height
            );

        }

    );


    const clock =
        new THREE.Clock();


    async function animate() {

        const delta =
            clock.getDelta();


        const elapsed =
            clock.getElapsedTime();


        await app.update(
            delta,
            elapsed
        );


        requestAnimationFrame(
            animate
        );

    }


    requestAnimationFrame(
        animate
    );

}


run().catch(

    err => {

        console.error(
            err
        );

        showError(

            err?.message ||

            String(err)

        );

    }

);

</script>
