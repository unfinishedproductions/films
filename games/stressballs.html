if (!navigator.gpu) {
  throw new Error(
    "WebGPU is unavailable. Use current Chrome or Edge on Android/desktop " +
    "and serve this page over HTTPS."
  );
}

function block(lines) {
  return lines.join("\n");
}

async function getText(path) {
  status.textContent = "Loading Splash • " + path;
  const urls = [
    REPO + "/" + path,
    "https://raw.githubusercontent.com/matsuoka-601/Splash/main/" + path,
    "https://raw.githack.com/matsuoka-601/Splash/main/" + path
  ];
  let lastError = null;
  for (const url of urls) {
    try {
      const response = await fetch(url, { cache: "no-store", mode: "cors" });
      if (response.ok) return await response.text();
      lastError = new Error("HTTP " + response.status + " from " + url);
    } catch (error) {
      lastError = error;
    }
  }
  throw new Error(
    "Could not load Splash source " + path + ". " +
    "Tried GitHub, jsDelivr and githack. " +
    String(lastError?.message || lastError || "Network request failed")
  );
}

function dirname(path) {
  const index = path.lastIndexOf("/");
  return index === -1 ? "" : path.substring(0, index + 1);
}

function normalizePath(path) {
  const output = [];
  path.split("/").forEach(function (piece) {
    if (!piece || piece === ".") return;
    if (piece === "..") output.pop();
    else output.push(piece);
  });
  return output.join("/");
}

function resolvePath(parent, relative) {
  return normalizePath(dirname(parent) + relative);
}

function rewritePackages(source) {
  return source
    .replace(
      /from\s+['"]wgpu-matrix['"]/g,
      'from "https://cdn.jsdelivr.net/npm/wgpu-matrix@3.3.0/+esm"'
    )
    .replace(
      /from\s+['"]lil-gui['"]/g,
      'from "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/+esm"'
    );
}

function compile(source, filename) {
  const result = TS.transpileModule(source, {
    fileName: filename,
    compilerOptions: {
      target: TS.ScriptTarget.ES2022,
      module: TS.ModuleKind.ES2022,
      moduleResolution: TS.ModuleResolutionKind.Bundler,
      useDefineForClassFields: false,
      strict: false
    }
  });
  if (result.diagnostics && result.diagnostics.length) {
    console.warn("TypeScript diagnostics for " + filename, result.diagnostics);
  }
  return result.outputText;
}

function moduleURL(source) {

    new Blob([source], { type: "text/javascript" })

const MATERIAL_STRUCT_WGSL = block([
  "struct MaterialParams {",
  "  physical: vec4f,",
  "  motion: vec4f,",
  "  behavior: vec4f,",
  "  surface: vec4f,",
  "  interaction: vec4f,",
  "  cloudBrush0: vec4f,",
  "  cloudBrush1: vec4f,",
  "  cloudBrush2: vec4f,",
  "  cloudBrush3: vec4f,",
  "  cloudBrush4: vec4f,",
  "  cloudBrush5: vec4f,",
  "  cloudBrush6: vec4f,",
  "  cloudBrush7: vec4f,",
  "}"
]);

function patchP2GMaterial(shader) {
  shader = shader.replace(
    "struct Particle {",
    MATERIAL_STRUCT_WGSL + "\nstruct Particle {"
  );
  shader = shader.replace(
    "@group(0) @binding(5) var<uniform> dt: f32;",
    block([
      "@group(0) @binding(5) var<uniform> dt: f32;",
      "@group(0) @binding(6) var<uniform> material: MaterialParams;"
    ])
  );

  const constitutiveRegex =
    /\s*let volume:\s*f32\s*=\s*1\.0\s*\/\s*density;[^\n]*\n\s*densities\[id\.x\]\s*=\s*density;[\s\S]*?stress\s*\+=\s*dynamicViscosity\s*\*\s*strain;/;
  const originalConstitutive = shader.match(constitutiveRegex);
  if (!originalConstitutive) {
    throw new Error("Could not install material constitutive response.");
  }
  const variantConstitutive = block([
    "",
    "        // Water has already run Splash's original equations above.",
    "        // Only non-water materials replace the resulting stress.",
    "        if (material.interaction.z > 0.5) {",
    "            var variantPressure = max(",
    "                material.physical.w,",
    "                material.physical.x *",
    "                (pow(density / material.physical.y, 1.0) - 1.0)",
    "            );",
    "            let strainMagnitude = sqrt(",
    "                dot(strain[0],strain[0]) +",
    "                dot(strain[1],strain[1]) +",
    "                dot(strain[2],strain[2])",
    "            );",
    "            let shear = smoothstep(",
    "                material.behavior.x * 0.18,",
    "                max(material.behavior.x, 0.0001),",
    "                strainMagnitude",
    "            );",
    "            if (material.interaction.z < 2.5) {",
    "                variantPressure *= mix(1.0, 0.34, shear);",
    "            }",
    "            stress = mat3x3f(",
    "                -variantPressure,0.0,0.0,",
    "                0.0,-variantPressure,0.0,",
    "                0.0,0.0,-variantPressure",
    "            );",
    "            var variantViscosity = material.physical.z;",
    "            if (material.interaction.z < 2.5) {",
    "                variantViscosity = mix(",
    "                    material.physical.z,",
    "                    material.physical.z * 0.075,",
    "                    shear",
    "                );",
    "            }",
    "            stress += variantViscosity * strain;",
    "        }"
  ]);
  shader = shader.replace(
    constitutiveRegex,
    originalConstitutive[0] + variantConstitutive
  );
  return shader;
}

function patchGridMaterial(shader) {
  shader = shader.replace(
    "struct MouseInfo {",
    MATERIAL_STRUCT_WGSL + "\nstruct MouseInfo {"
  );
  shader = shader.replace(
    "@group(0) @binding(6) var<uniform> dt: f32;",
    block([
      "@group(0) @binding(6) var<uniform> dt: f32;",
      "@group(0) @binding(7) var<uniform> material: MaterialParams;"
    ])
  );

  const gravityRegex =
    /floatV\.y\s*\+\s*strength\s*\*\s*forceDir\.y\s*-\s*0\.40\s*\*\s*dt/g;
  if (!gravityRegex.test(shader)) {
    throw new Error("Could not locate Splash downward gravity.");
  }
  gravityRegex.lastIndex = 0;
  shader = shader.replace(
    gravityRegex,
    "floatV.y + strength * forceDir.y"
  );

  const normalizationRegex =
    /floatV\s*\/=\s*decodeFixedPoint\s*\(\s*cells\s*\[\s*id\.x\s*\]\.mass\s*\)\s*;/;
  const match = shader.match(normalizationRegex);
  if (!match) throw new Error("Could not locate Splash grid normalization.");

  const materialMotion = block([
    "",
    "            let gridX=f32(i32(id.x)/i32(initBoxSize.z)/i32(initBoxSize.y));",
    "            let gridY=f32((i32(id.x)/i32(initBoxSize.z))%i32(initBoxSize.y));",
    "            let gridZ=f32(i32(id.x)%i32(initBoxSize.z));",
    "            let gridPosition=vec3f(gridX,gridY,gridZ);",
    "            let toCenter=initBoxSize*0.5-gridPosition;",
    "            // Exact zero-G water field from the first build.",
    "            floatV += toCenter * 0.016 * dt;",
    "            floatV *= max(0.0, 1.0 - 0.015 * dt);",
    "            if (material.interaction.z > 0.5) {",
    "                floatV += toCenter * (material.motion.x - 0.016) * dt;",
    "                let flowSpeed=length(floatV);",
    "                if (flowSpeed>0.0001) {",
    "                    floatV *= max(0.0,1.0-material.interaction.y*dt/flowSpeed);",
    "                }",
    "                let phase=gridX*.37+gridY*.23+gridZ*.31;",
    "                let drift=vec3f(",
    "                    sin(phase+gridY*.11),",
    "                    cos(phase*.83+gridZ*.09),",
    "                    sin(phase*1.17+gridX*.07)",
    "                );",
    "                floatV += drift * material.behavior.z * dt;",
    "                floatV.y += material.behavior.w * dt;",
    "                floatV *= max(",
    "                    0.0,",
    "                    1.0 - max(0.0, material.motion.y - 0.015) * dt",
    "                );",
    "            }",
    ""
  ]);
  shader = shader.replace(normalizationRegex, match[0] + materialMotion);
  shader = shader.replace(
    /let strength = smoothstep\(r\*r,\s*0\.,\s*cellSquareDistToMouse\) \* 0\.2;/,
    block([
      "var strength=smoothstep(r*r,0.,cellSquareDistToMouse)*0.2;",
      "            if(material.interaction.z>0.5){",
      "                strength*=material.motion.z;",
      "            }"
    ])
  );
  return shader;
}

function patchG2PMaterial(shader) {
  shader = shader.replace(
    "struct Particle {",
    MATERIAL_STRUCT_WGSL + "\nstruct Particle {"
  );
  shader = shader.replace(
    "@group(0) @binding(5) var<uniform> dt: f32;",
    block([
      "@group(0) @binding(5) var<uniform> dt: f32;",
      "@group(0) @binding(6) var<uniform> material: MaterialParams;"
    ])
  );
  shader = shader.replace(
    "particles[id.x].C = B * 4.0f;",
    block([
      "particles[id.x].C = B * 4.0f;",
      "        // Preserve Splash verbatim for Water; alter only variants.",
      "        if(material.interaction.z>0.5){",
      "            var updatedC=particles[id.x].C;",
      "            let cNorm=sqrt(",
      "                dot(updatedC[0],updatedC[0])+",
      "                dot(updatedC[1],updatedC[1])+",
      "                dot(updatedC[2],updatedC[2])",
      "            );",
      "            let movement=smoothstep(.08,1.8,length(particles[id.x].v));",
      "            var yieldLimit=material.behavior.x;",
      "            if(material.interaction.z<2.5){",
      "                yieldLimit=mix(yieldLimit,yieldLimit*5.0,movement);",
      "            }",
      "            if(cNorm>yieldLimit){",
      "                updatedC*=yieldLimit/max(cNorm,.0001);",
      "            }",
      "            var damping=material.behavior.y;",
      "            var retention=material.motion.w;",
      "            if(material.interaction.z<2.5){",
      "                damping=mix(damping,damping*.06,movement);",
      "                retention=mix(retention,1.0,movement);",
      "                let p=particles[id.x].position;",
      "                let phase=p.x*.73+p.y*1.11+p.z*.47;",
      "                let scatter=vec3f(",
      "                    sin(phase*1.7),",
      "                    cos(phase*1.3),",
      "                    sin(phase*2.1+.8)",
      "                );",
      "                particles[id.x].v+=",
      "                    scatter*material.behavior.z*movement;",
      "            }",
      "            updatedC*=max(0.0,1.0-damping);",
      "            particles[id.x].C=updatedC;",
      "            particles[id.x].v*=retention;",
      "        }"
    ])
  );
  return shader;
}

function patchFluidSurface(shader) {
  shader = shader.replace(
    "@group(0) @binding(0) var textureSampler: sampler;",
    MATERIAL_STRUCT_WGSL +
      "\n@group(0) @binding(0) var textureSampler: sampler;"
  );
  shader = shader.replace(
    "@group(0) @binding(7) var<uniform> density: f32;",
    block([
      "@group(0) @binding(7) var<uniform> density: f32;",
      "@group(0) @binding(8) var<uniform> material: MaterialParams;"
    ])
  );
  shader = shader.replace(
    /if \(depth >= 1e4\) \{\s*let bgColor:[\s\S]*?return vec4f\(bgColor, 0\.\);\s*\}/,
    block([
      "if (depth >= 1e4) {",
      "        return vec4f(0.);",
      "    }"
    ])
  );
  // Splash's stock shader contains a hard-coded grey tiled floor.
  // Refraction now samples the synchronized background texture directly,
  // while reflection uses only the synchronized cubemap in every direction.
  shader = shader.replace(
    "var transmitted = pow(textureSampleLevel(envmapTexture, textureSampler, refractionDirWorld, 0.0).rgb, vec3f(2.2));",
    block([
      "let refractedUV = calcReflactedTexCoord(surfacePosView, refractionDirView, thickness);",
      "    var transmitted = pow(textureSampleLevel(bgTexture, textureSampler, refractedUV, 0.0).rgb, vec3f(2.2));"
    ])
  );
  shader = shader.replace(
    /\s*if \(refractionDirWorld\.y < 0\.\) \{[\s\S]*?transmitted = select\(transmitted, invGamma\(floor\.rgb\), floor\.w > 0\.5\);\s*\}/,
    ""
  );
  shader = shader.replace(
    /var reflectionColor: vec3f = invGamma\(select\(textureSampleLevel\(envmapTexture, textureSampler, reflectionDirWorld, 0\.\)\.rgb, vec3f\(0\.75\), reflectionDirWorld\.y < 0\.\)\);/,
    "var reflectionColor: vec3f = invGamma(textureSampleLevel(envmapTexture, textureSampler, reflectionDirWorld, 0.).rgb);"
  );
  shader = shader.replace(
    /\s*fresnel = select\(fresnel, 0\.1 \* fresnel, reflectionDirWorld\.y < 0\.\);\s*fresnelBiased = select\(fresnelBiased, 0\.1 \* fresnelBiased, reflectionDirWorld\.y < 0\.\);/,
    ""
  );

  shader = shader.replace(
    /var finalColor = 0\.0\s*\*\s*specular \+ mix\(refractionColor, reflectionColor, fresnel\) \+ 0\. \* fresnel;\s*\n\s*return vec4f\(gamma\(finalColor\), 1\.0\);/,
    block([
      "var finalColor = 0.0 * specular + " +
        "mix(refractionColor, reflectionColor, fresnel) + 0. * fresnel;",
      "    if (material.interaction.z < 0.5) {",
      "        finalColor = min(finalColor * 1.08 + vec3f(0.012), vec3f(1.0));",
      "    }",
      "    if (material.interaction.z > 0.5) {",
      "        let tintAmount = clamp(material.surface.x, 0.0, 0.94);",
      "        let roughness = clamp(material.surface.y, 0.0, 1.0);",
      "        let edgeLight = mix(",
      "            0.80, 1.10, fresnel * (1.0 - roughness * 0.58)",
      "        );",
      "        let sheen = pow(",
      "            clamp(fresnel, 0.0, 1.0),",
      "            mix(1.5, 5.0, roughness)",
      "        ) * material.surface.z * 0.16;",
      "        let tinted = diffuseColor * edgeLight + vec3f(sheen);",
      "        finalColor = mix(finalColor, tinted, tintAmount);",
      "    }",
      "    if (material.interaction.z > 1.5 && material.interaction.z < 2.5) {",
      "        let grazing = pow(clamp(fresnel, 0.0, 1.0), 2.4);",
      "        let warmBody = diffuseColor * (0.72 + 0.22 * (1.0 - fresnel));",
      "        let softSpec = reflectionColor * grazing * 0.055;",
      "        let depthShade = mix(0.84, 1.08, smoothstep(0.10, 1.65, thickness));",
      "        finalColor = warmBody * depthShade + softSpec;",
      "    }",
      "    if (material.interaction.z > 2.5 && material.interaction.z < 3.5) {",
      "        let t = max(thickness, 0.0);",
      "        let membrane = 1.0 - smoothstep(0.18, 0.72, t);",
      "        let deep = smoothstep(0.55, 2.25, t);",
      "        let absorption = exp(-vec3f(2.35, 0.24, 2.10) * t * 0.92);",
      "        let transmittedSlime = transmitted * absorption + diffuseColor * (vec3f(1.0) - absorption);",
      "        let sculpt = 0.66 + 0.34 * (1.0 - clamp(fresnel, 0.0, 1.0));",
      "        let cavity = 0.74 + 0.26 * deep;",
      "        let body = diffuseColor * sculpt * cavity * mix(0.90, 1.08, deep);",
      "        let rim = pow(clamp(fresnel, 0.0, 1.0), 2.1);",
      "        let sharpHighlight = pow(clamp(fresnelBiased, 0.0, 1.0), 4.8);",
      "        let envSpec = reflectionColor * (0.10 + rim * 0.72 + sharpHighlight * 0.46);",
      "        let thickColor = body + envSpec;",
      "        let membraneColor = transmittedSlime * 0.78 + diffuseColor * 0.20 + envSpec * 0.48;",
      "        finalColor = mix(thickColor, membraneColor, membrane * 0.88);",
      "    }",
      "    return vec4f(gamma(finalColor), 1.0);"
    ])
  );
  return shader;
}

function patchEnvironmentBackground(shader) {
  // Splash's original bgColor.wgsl paints a finite grey grid floor below
  // the camera. Replace the fragment body after bgColor sampling so the
  // background is exclusively the currently synchronized environment.
  return shader.replace(
    /let bgColor = textureSampleLevel\(envmapTexture, textureSampler, rayDirWorld, 0\.\)\.rgb;[\s\S]*?return vec4f\(finalColor, 1\.\);\s*\}/,
    block([
      "let bgColor = textureSampleLevel(envmapTexture, textureSampler, rayDirWorld, 0.).rgb;",
      "    return vec4f(bgColor, 1.);",
      "}"
    ])
  );
}

function patchCloudVolume(shader) {
  shader = shader.replace(
    "struct FragmentInput {",
    MATERIAL_STRUCT_WGSL + "\nstruct FragmentInput {"
  );
  shader = shader.replace(
    "@group(0) @binding(6) var<uniform> densityGridSize: vec3f;",
    block([
      "@group(0) @binding(6) var<uniform> densityGridSize: vec3f;",
      "@group(0) @binding(7) var<uniform> diffuseColor: vec3f;",
      "@group(0) @binding(8) var<uniform> colorDensity: f32;",
      "@group(0) @binding(9) var<uniform> material: MaterialParams;"
    ])
  );
  shader = shader.replace(
    /if \(depth >= 1e4\) \{\s*let bgColor:[\s\S]*?return vec4f\(bgColor, 0\.\);\s*\}/,
    block([
      "if (depth >= 1e4) {",
      "        return vec4f(0.);",
      "    }"
    ])
  );
  shader = shader.replace(
    "@fragment\nfn fs",
    block([
      "fn applyCloudBrush(uv: vec2f, brush: vec4f) -> f32 {",
      "    if (brush.w <= 0.001) { return 1.0; }",
      "    var delta = uv - brush.xy;",
      "    delta.x *= uniforms.texelSize.y / max(uniforms.texelSize.x, 1e-8);",
      "    let brushDistance = length(delta);",
      "    let feather = smoothstep(brush.z * 0.24, brush.z, brushDistance);",
      "    return 1.0 - brush.w * (1.0 - feather);",
      "}",
      "",
      "fn cloudBrushSurvival(uv: vec2f) -> f32 {",
      "    var survival = 1.0;",
      "    survival *= applyCloudBrush(uv, material.cloudBrush0);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush1);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush2);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush3);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush4);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush5);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush6);",
      "    survival *= applyCloudBrush(uv, material.cloudBrush7);",
      "    return survival;",
      "}",
      "",
      "@fragment",
      "fn fs"
    ])
  );
  shader = shader.replace(
    "let densityScale: f32 = 0.2;",
    "let densityScale: f32 = 0.095 * colorDensity;"
  );
  shader = shader.replace(
    "let albedo: vec3f = vec3f(0, 70, 250) / 256.;",
    "let albedo: vec3f = diffuseColor;"
  );
  shader = shader.replace(
    "return vec4f(gamma(finalColor), 1.);",
    block([
      "let localCoord = clamp(",
      "        surfacePosWorld / densityGridSize,",
      "        vec3f(0.002), vec3f(0.998)",
      "    );",
      "    let localStep = vec3f(1.6) / densityGridSize;",
      "    var softDensity = textureSampleLevel(",
      "        densityGridTexture, textureSampler, localCoord.zyx, 0.",
      "    ).r * 0.34;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord + vec3f(localStep.x, 0., 0.)).zyx, 0.",
      "    ).r * 0.11;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord - vec3f(localStep.x, 0., 0.)).zyx, 0.",
      "    ).r * 0.11;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord + vec3f(0., localStep.y, 0.)).zyx, 0.",
      "    ).r * 0.11;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord - vec3f(0., localStep.y, 0.)).zyx, 0.",
      "    ).r * 0.11;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord + vec3f(0., 0., localStep.z)).zyx, 0.",
      "    ).r * 0.11;",
      "    softDensity += textureSampleLevel(",
      "        densityGridTexture, textureSampler,",
      "        (localCoord - vec3f(0., 0., localStep.z)).zyx, 0.",
      "    ).r * 0.11;",
      "    let fogEnvelope = 1.0 - exp(-max(0.0, softDensity) * colorDensity * 0.82);",
      "    let softEdge = smoothstep(0.006, 0.70, fogEnvelope);",
      "    let survival = cloudBrushSurvival(input.uv);",
      "    let alpha = material.interaction.w * softEdge * survival;",
      "    var cloudColor = mix(diffuseColor * 0.985, finalColor, 0.20);",
      "    cloudColor = mix(cloudColor, vec3f(1.0), 0.42 * softEdge);",
      "    return vec4f(gamma(cloudColor) * alpha, alpha);"
    ])
  );
  return shader;
}

/*
   Keep Splash's original surface and volume shaders intact.  The only
   wrapper-level change is making their empty pixels transparent so the
   independent 360-degree panorama remains visible behind the fluid.
*/
function patchTransparentFluidBackground(shader) {
  return shader.replace(
    /if \(depth >= 1e4\) \{\s*let bgColor:[\s\S]*?return vec4f\(bgColor, 0\.\);\s*\}/,
    block([
      "if (depth >= 1e4) {",
      "        return vec4f(0.);",
      "    }"
    ])
  );
}

async function inlineWGSL(source, modulePath) {
  const regex =
    /import\s+([A-Za-z_$][\w$]*)\s+from\s+['"]([^'"]+\.wgsl)['"]\s*;?/g;
  const imports = Array.from(source.matchAll(regex));
  for (const match of imports) {
    const fullImport = match[0];
    const variableName = match[1];
    const shaderPath = resolvePath(modulePath, match[2]);
    let shaderSource = await getText(shaderPath);
    if (shaderPath === "mls-mpm/p2g_2.wgsl") {
      shaderSource = patchP2GMaterial(shaderSource);
    }
    if (shaderPath === "mls-mpm/updateGrid.wgsl") {
      shaderSource = patchGridMaterial(shaderSource);
    }
    if (shaderPath === "mls-mpm/g2p.wgsl") {
      shaderSource = patchG2PMaterial(shaderSource);
    }
    if (shaderPath === "render/fluid.wgsl") {
      shaderSource = patchFluidSurface(shaderSource);
    }
    if (shaderPath === "render/bgColor.wgsl") {
      shaderSource = patchEnvironmentBackground(shaderSource);
    }
    if (shaderPath === "render/densityRaymarch.wgsl") {
      shaderSource = patchCloudVolume(shaderSource);
    }
    source = source.replace(
      fullImport,
      "const " + variableName + " = " + JSON.stringify(shaderSource) + ";"
    );
  }
  return source;
}

async function buildCamera() {
  let source = rewritePackages(await getText("camera.ts"));
  source = source.replace(
    /this\.canvas\s*=\s*canvas\s*;/,
    block([
      "this.canvas = canvas;",
      "        this.prevHoverX = canvas.clientWidth * 0.5;",
      "        this.prevHoverY = canvas.clientHeight * 0.5;",
      "        this.currentHoverX = canvas.clientWidth * 0.5;",
      "        this.currentHoverY = canvas.clientHeight * 0.5;"
    ])
  );
  source = source.replace(
    "mat4.rotateY(mat, this.currentXtheta, mat)",
    block([
      "const gyro = (window as any).__stressLabOrientation || " +
        "{ yaw: 0, pitch: 0 };",
      "        mat4.rotateY(mat, this.currentXtheta + gyro.yaw, mat)"
    ])
  );
  source = source.replace(
    "mat4.rotateX(mat, this.currentYtheta, mat)",
    "mat4.rotateX(mat, this.currentYtheta + gyro.pitch, mat)"
  );
  return moduleURL(compile(source, "camera.ts"));
}

function patchInitialBlob(source) {
  const start = source.indexOf("    initDambreak(");
  const end = source.indexOf("    reset(", start);
  if (start === -1 || end === -1) {
    throw new Error("Could not locate Splash initDambreak().");
  }

  const replacement = block([
    "    initDambreak(initBoxSize: number[], numParticles: number) {",
    "        const particlesBuf = new ArrayBuffer(",
    "            mlsmpmParticleStructSize * this.maxParticleCount",
    "        );",
    "        const materialId =",
    "            (window as any).__stressLabMaterial?.id || 'water';",
    "        const spacing = 0.90;",
    "        const centerX = initBoxSize[0] * 0.5;",
    "        const centerY = initBoxSize[1] * 0.5;",
    "        const centerZ = initBoxSize[2] * 0.5;",
    "        const approximateRadius = Math.cbrt(",
    "            numParticles * spacing * spacing * spacing *",
    "            (3 / (4 * Math.PI))",
    "        ) * 1.075;",
    "        const boxLimit = Math.min(",
    "            initBoxSize[0], initBoxSize[1], initBoxSize[2]",
    "        ) * 0.5 - 4.5;",
    "        const radius = Math.min(approximateRadius, boxLimit);",
    "        const radiusSquared = radius * radius;",
    "        const candidates: {",
    "            x: number, y: number, z: number, d2: number",
    "        }[] = [];",
    "",
    "        for (",
    "            let x = centerX - radius;",
    "            x <= centerX + radius;",
    "            x += spacing",
    "        ) {",
    "            for (",
    "                let y = centerY - radius;",
    "                y <= centerY + radius;",
    "                y += spacing",
    "            ) {",
    "                for (",
    "                    let z = centerZ - radius;",
    "                    z <= centerZ + radius;",
    "                    z += spacing",
    "                ) {",
    "                    const dx = x - centerX;",
    "                    const dy = y - centerY;",
    "                    const dz = z - centerZ;",
    "                    const d2 = dx * dx + dy * dy + dz * dz;",
    "                    if (d2 <= radiusSquared) {",
    "                        candidates.push({ x, y, z, d2 });",
    "                    }",
    "                }",
    "            }",
    "        }",
    "",
    "        candidates.sort((a, b) => a.d2 - b.d2);",
    "        const actualCount = Math.min(",
    "            numParticles, this.maxParticleCount, candidates.length",
    "        );",
    "",
    "        for (let n = 0; n < actualCount; n++) {",
    "            const point = candidates[n];",
    "            const offset = mlsmpmParticleStructSize * n;",
    "            const particleViews = {",
    "                position: new Float32Array(particlesBuf, offset, 3),",
    "                v: new Float32Array(particlesBuf, offset + 16, 3),",
    "                C: new Float32Array(particlesBuf, offset + 32, 12)",
    "            };",
    "",
    "            let px = point.x;",
    "            let py = point.y;",
    "            let pz = point.z;",
    "            let jitter = 0.055;",
    "            if (materialId === 'snow') jitter = 0.032;",
    "            if (materialId === 'sand') jitter = 0.085;",
    "            if (materialId === 'slime') jitter = 0.024;",
    "            if (materialId === 'cloud') {",
    "                jitter = 0.12;",
    "                const dx = point.x - centerX;",
    "                const dy = point.y - centerY;",
    "                const dz = point.z - centerZ;",
    "                const puff =",
    "                    1.0 +",
    "                    0.075 * Math.sin(dy * 0.48 + dz * 0.17) +",
    "                    0.055 * Math.sin(dx * 0.31 - dz * 0.43) +",
    "                    0.035 * Math.cos(dx * 0.57 + dy * 0.29);",
    "                px = centerX + dx * puff;",
    "                py = centerY + dy * puff;",
    "                pz = centerZ + dz * puff;",
    "            }",
    "",
    "            particleViews.position.set([",
    "                px + (Math.random() - 0.5) * jitter,",
    "                py + (Math.random() - 0.5) * jitter,",
    "                pz + (Math.random() - 0.5) * jitter",
    "            ]);",
    "            particleViews.v.set([0, 0, 0]);",
    "            particleViews.C.fill(0);",
    "        }",
    "",
    "        this.numParticles = actualCount;",
    "        return particlesBuf.slice(",
    "            0, mlsmpmParticleStructSize * actualCount",
    "        );",
    "    }",
    "",
    ""
  ]);
  return source.substring(0, start) + replacement + source.substring(end);
}

function patchSimulatorMaterialBuffer(source) {
  source = source.replace(
    "dtBuffer: GPUBuffer",
    "dtBuffer: GPUBuffer\n    materialBuffer: GPUBuffer"
  );

  const dtBufferRegex =
    /this\.dtBuffer\s*=\s*device\.createBuffer\(\{[\s\S]*?usage:\s*GPUBufferUsage\.UNIFORM\s*\|\s*GPUBufferUsage\.COPY_DST,\s*\}\)/;
  const dtMatch = source.match(dtBufferRegex);
  if (!dtMatch) throw new Error("Could not locate Splash dt buffer.");
  source = source.replace(
    dtBufferRegex,
    dtMatch[0] + "\n" + block([
      "        this.materialBuffer = device.createBuffer({",
      "            label: 'stress material buffer',",
      "            size: 208,",
      "            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,",
      "        })",
      "        this.setMaterial([",
      "            50,3,0.16,0,",
      "            0.016,0.015,1,1,",
      "            999,0,0,0,",
      "            0,0,1,1.333,",
      "            0,0,0,1",
      "        ])"
    ])
  );

  const p2g2End =
    /(\{ binding: 5, resource: \{ buffer: this\.dtBuffer \}\},\s*)(\]\s*\}\)\s*this\.p2gDensityBindGroup)/;
  source = source.replace(p2g2End, function (_, entry, rest) {
    return entry +
      "{ binding: 6, resource: { buffer: this.materialBuffer }},\n            " +
      rest;
  });

  const updateGridEnd =
    /(\{ binding: 6, resource: \{ buffer: this\.dtBuffer \}\},\s*)(\],\s*\}\)\s*this\.g2pBindGroup)/;
  source = source.replace(updateGridEnd, function (_, entry, rest) {
    return entry +
      "{ binding: 7, resource: { buffer: this.materialBuffer }},\n            " +
      rest;
  });

  const g2pEnd =
    /(\{ binding: 5, resource: \{ buffer: this\.dtBuffer \}\},\s*)(\],\s*\}\)\s*this\.copyPositionBindGroup)/;
  source = source.replace(g2pEnd, function (_, entry, rest) {
    return entry +
      "{ binding: 6, resource: { buffer: this.materialBuffer }},\n            " +
      rest;
  });

  source = source.replace(
    "    changeBoxSize(realBoxSize: number[]) {",
    block([
      "    setMaterial(params: number[]) {",
      "        const values = new Float32Array(20)",
      "        values.set(params.slice(0,20))",
      "        this.device.queue.writeBuffer(this.materialBuffer,0,values)",
      "    }",
      "",
      "    setCloudBrushes(params: Float32Array) {",
      "        this.device.queue.writeBuffer(this.materialBuffer,80,params)",
      "    }",
      "",
      "    changeBoxSize(realBoxSize: number[]) {"
    ])
  );
  return source;
}

async function buildMLSMPM() {
  let source = await getText("mls-mpm/mls-mpm.ts");
  source = source.replace(
    /dynamicViscosity\s*:\s*0\.1\s*,/,
    "dynamicViscosity: 0.16,"
  );
  source = patchInitialBlob(source);
  source = patchSimulatorMaterialBuffer(source);
  source = await inlineWGSL(source, "mls-mpm/mls-mpm.ts");
  return moduleURL(compile(source, "mls-mpm/mls-mpm.ts"));
}

function patchRendererMaterialBuffer(source) {
  source = source.replace(
    /depthMapTextureView:\s*GPUTextureView,\s*cubemapTextureView:\s*GPUTextureView,\s*densityGridTextureView:\s*GPUTextureView,/,
    "depthMapTextureView: GPUTextureView, cubemapTextureView: GPUTextureView, " +
      "densityGridTextureView: GPUTextureView, materialBuffer: GPUBuffer,"
  );

  const fluidEnd =
    /(\{ binding: 7, resource: \{ buffer: this\.colorDensityBuffer \}\},\s*)(\],\s*\}\)\s*this\.depthMapBindGroup)/;
  source = source.replace(fluidEnd, function (_, entry, rest) {
    return entry +
      "{ binding: 8, resource: { buffer: materialBuffer }},\n            " +
      rest;
  });

  const cloudEnd =
    /(\{ binding: 6, resource: \{ buffer: this\.densityGridSizeBuffer \}\},\s*)(\]\s*\}\)\s*console\.log)/;
  source = source.replace(cloudEnd, function (_, entry, rest) {
    return entry +
      "{ binding: 7, resource: { buffer: this.diffuseColorBuffer }},\n" +
      "                { binding: 8, resource: { buffer: this.colorDensityBuffer }},\n" +
      "                { binding: 9, resource: { buffer: materialBuffer }},\n            " +
      rest;
  });

  return source;
}

async function buildFluidRenderer() {
  let source = await getText("render/fluidRender.ts");
  source = patchRendererMaterialBuffer(source);
  source = await inlineWGSL(source, "render/fluidRender.ts");
  return moduleURL(compile(source, "render/fluidRender.ts"));
}

async function buildMain(cameraURL, mpmURL, rendererURL) {
  let source = await getText("main.ts");
  source = source
    .replace(
      /from\s+['"]\.\/camera['"]/g,
      "from " + JSON.stringify(cameraURL)
    )
    .replace(
      /from\s+['"]\.\/mls-mpm\/mls-mpm['"]/g,
      "from " + JSON.stringify(mpmURL)
    )
    .replace(
      /from\s+['"]\.\/render\/fluidRender['"]/g,
      "from " + JSON.stringify(rendererURL)
    );
  source = rewritePackages(source);

  source = source.replace(
    /const canvas:\s*HTMLCanvasElement\s*=\s*document\.querySelector\('canvas'\)!/,
    "const canvas = document.getElementById('fluidCanvas') as HTMLCanvasElement"
  );
  source = source.replace(
    /context\.configure\(\{\s*device,\s*format:\s*presentationFormat,\s*\}\)/g,
    block([
      "context.configure({",
      "        device,",
      "        format: presentationFormat,",
      "        alphaMode: 'premultiplied',",
      "    })"
    ])
  );

  const cubeNames = ["posx", "negx", "posy", "negy", "posz", "negz"];
  const cubeFallbackSources = cubeNames.map(function (name) {
    return REPO + "/public/cubemap/" + name + ".png";
  });
  const cubeListRegex =
    /const imgSrcs\s*=\s*\[[\s\S]*?\];/;
  if (!cubeListRegex.test(source)) {
    throw new Error("Could not locate Splash cubemap source list.");
  }
  source = source.replace(
    cubeListRegex,
    CUBEMAP_DATA_URLS
      ? "const imgSrcs = (window as any).__stressLabCubemapData;"
      : "const imgSrcs = " + JSON.stringify(cubeFallbackSources) + ";"
  );
  const cubeLoaderRegex =
    /const promises\s*=\s*imgSrcs\.map\(async \(src\) => \{[\s\S]*?\}\);\s*const imageBitmaps\s*=\s*await Promise\.all\(promises\);/;
  if (!cubeLoaderRegex.test(source)) {
    throw new Error("Could not locate Splash cubemap loader.");
  }
  source = source.replace(
    cubeLoaderRegex,
    block([
      "const imageBitmaps = await Promise.all(imgSrcs.map(async (src) => {",
      "            if (src.startsWith('data:')) {",
      "                const comma = src.indexOf(',');",
      "                const binary = atob(src.slice(comma + 1));",
      "                const bytes = new Uint8Array(binary.length);",
      "                for (let i = 0; i < binary.length; i++) {",
      "                    bytes[i] = binary.charCodeAt(i);",
      "                }",
      "                return createImageBitmap(new Blob([bytes], { type: 'image/png' }));",
      "            }",
      "            const response = await fetch(src);",
      "            if (!response.ok) throw new Error('Cubemap HTTP ' + response.status);",
      "            return createImageBitmap(await response.blob());",
      "        }));"
    ])
  );

  const cubeViewRegex =
    /const cubemapTextureView\s*=\s*cubemapTexture\.createView\(\{\s*dimension:\s*['"]cube['"],\s*\}\);/;
  if (!cubeViewRegex.test(source)) {
    throw new Error("Could not locate Splash cubemap texture view.");
  }
  source = source.replace(
    cubeViewRegex,
    function (match) {
      return match + block([
        "\n    ;(window as any).__stressLabGpuEnvironment = {",
        "        device: device,",
        "        texture: cubemapTexture,",
        "        faceSize: cubemapTexture.width",
        "    }",
        "    if ((window as any).__stressLabApplyPendingEnvironment) {",
        "        ;(window as any).__stressLabApplyPendingEnvironment()",
        "    }"
      ]);
    }
  );

  source = source.replace(
    /\{\s*particleCount:\s*40000[^}]+\}/,
    "{ particleCount: 40000, initBoxSize: [60, 60, 60], " +
      "initDistance: 64, mouseRadius: 13, cameraTargetY: 30, " +
      "guiText: 'Small (40,000 particles)' }"
  );
  source = source.replace(
    /\{\s*particleCount:\s*70000[^}]+\}/,
    "{ particleCount: 70000, initBoxSize: [70, 70, 70], " +
      "initDistance: 73, mouseRadius: 14, cameraTargetY: 35, " +
      "guiText: 'Medium (70,000 particles)' }"
  );
  source = source.replace(
    /\{\s*particleCount:\s*100000[^}]+\}/,
    "{ particleCount: 100000, initBoxSize: [80, 80, 80], " +
      "initDistance: 82, mouseRadius: 15, cameraTargetY: 40, " +
      "guiText: 'Large (100,000 particles)' }"
  );
  source = source.replace(
    /\{\s*particleCount:\s*180000[^}]+\}/,
    "{ particleCount: 180000, initBoxSize: [92, 92, 92], " +
      "initDistance: 94, mouseRadius: 17, cameraTargetY: 46, " +
      "guiText: 'Very Large (180,000 particles)' }"
  );

  source = source.replace(
    /camera\.reset\s*\(\s*simulationParam\.initDistance\s*,\s*\[\s*initBoxSize\[0\]\s*\/\s*2\s*,\s*simulationParam\.cameraTargetY\s*,\s*initBoxSize\[2\]\s*\/\s*2\s*\]\s*,\s*mlsmpmFov\s*,\s*mlsmpmZoomRate\s*\)/,
    block([
      "camera.reset(",
      "        simulationParam.initDistance,",
      "        [initBoxSize[0] / 2, initBoxSize[1] / 2, initBoxSize[2] / 2],",
      "        mlsmpmFov,",
      "        mlsmpmZoomRate",
      "    )"
    ])
  );
  source = source.replace(
    /realBoxSize\[2\]\s*=\s*initBoxSize\[2\]\s*\*\s*boxWidthRatio\s*;/g,
    "realBoxSize[2] = initBoxSize[2];"
  );
  source = source.replace(
    /depthMapTextureView,\s*cubemapTextureView,\s*densityGridTextureView,\s*\n\s*canvas,/,
    "depthMapTextureView, cubemapTextureView, densityGridTextureView, " +
      "mlsmpmSimulator.materialBuffer,\n\t\tcanvas,"
  );
  source = source.replace(
    "let boxWidthRatio = 1.",
    "let boxWidthRatio = 1.\n    let stressMaterialVersion = -1"
  );

  source = source.replace(
    "const particle = document.getElementById(\"particle\") as HTMLInputElement",
    block([
      "const materialBridge = (window as any).__stressLabMaterial",
      "        const stressWaterDefaults =",
      "            (window as any).__stressLabWaterDefaults || {",
      "                r: guiParams.r,",
      "                g: guiParams.g,",
      "                b: guiParams.b,",
      "                colorDensity: guiParams.colorDensity,",
      "                speed: guiParams.speed",
      "            }",
      "        ;(window as any).__stressLabWaterDefaults = stressWaterDefaults",
      "        if (materialBridge && " +
        "materialBridge.version !== stressMaterialVersion) {",
      "            stressMaterialVersion = materialBridge.version",
      "            if (materialBridge.id !== 'snow') {",
      "                mlsmpmSimulator.setMaterial(materialBridge.params)",
      "                if (materialBridge.id === 'water') {",
      "                    guiParams.r = stressWaterDefaults.r",
      "                    guiParams.g = stressWaterDefaults.g",
      "                    guiParams.b = stressWaterDefaults.b",
      "                    guiParams.colorDensity = stressWaterDefaults.colorDensity",
      "                    guiParams.speed = stressWaterDefaults.speed",
      "                } else {",
      "                    guiParams.r = materialBridge.color[0]",
      "                    guiParams.g = materialBridge.color[1]",
      "                    guiParams.b = materialBridge.color[2]",
      "                    guiParams.colorDensity = materialBridge.density",
      "                    guiParams.speed = materialBridge.speed",
      "                }",
      "                if (initBoxSize[0] > 0) {",
      "                mlsmpmSimulator.reset(" +
        "initBoxSize, simulationParam.particleCount)",
      "                }",
      "            }",
      "        }",
      "        mlsmpmSimulator.setCloudBrushes(",
      "            (window as any).__stressLabCloudBrushes",
      "        )",
      "",
      "        const particle = " +
        "document.getElementById(\"particle\") as HTMLInputElement"
    ])
  );
  source = source.replace(
    "sphereRenderFl = particle.checked",
    "sphereRenderFl = materialBridge?.renderMode === 'volume' || particle.checked"
  );
  source = source.replace(
    /mlsmpmSimulator\.execute\(commandEncoder,\s*\n\s*\[camera\.currentHoverX \/ canvas\.clientWidth, camera\.currentHoverY \/ canvas\.clientHeight\],\s*\n\s*camera\.calcMouseVelocity\(\), simulationParam\.mouseRadius, sphereRenderFl, maxDt \* guiParams\.speed, guiParams\.running,\s*\n\s*densityGridSize\s*\)/,
    block([
      "const pinch = (window as any).__stressLabSlimePinch",
      "        const defaultPosition = [camera.currentHoverX / canvas.clientWidth, camera.currentHoverY / canvas.clientHeight]",
      "        const defaultVelocity = camera.calcMouseVelocity()",
      "        const brushRadius = (materialBridge?.id === 'water' ? simulationParam.mouseRadius : (materialBridge?.mouseRadius ?? simulationParam.mouseRadius))",
      "        if (materialBridge?.id === 'slime' && pinch?.active && pinch.a && pinch.b) {",
      "            // Two actual MPM substeps: each finger applies its own local contact force.",
      "            // Opposing contacts compress an almost-incompressible viscous body, so",
      "            // bulges/folds are generated by the solver instead of painted in the shader.",
      "            const fingers = [pinch.a, pinch.b]",
      "            for (let pi = 0; pi < 2; pi++) {",
      "                const finger = fingers[pi]",
      "                const other = fingers[1 - pi]",
      "                const oldPlane = camera.calcPlaneCoord(finger.prevX, finger.prevY)",
      "                const newPlane = camera.calcPlaneCoord(finger.x, finger.y)",
      "                const towardX = other.x - finger.x",
      "                const towardY = other.y - finger.y",
      "                const towardLength = Math.max(1, Math.hypot(towardX, towardY))",
      "                const closing = Math.max(0, pinch.closing || 0)",
      "                const grip = Math.min(2.35, 0.16 + closing * 0.046)",
      "                const interactionPosition = [finger.x / canvas.clientWidth, finger.y / canvas.clientHeight]",
      "                const interactionVelocity = [",
      "                    (newPlane[0] - oldPlane[0]) * 1.34 + towardX / towardLength * grip,",
      "                    (newPlane[1] - oldPlane[1]) * 1.34 - towardY / towardLength * grip,",
      "                    0, 0",
      "                ]",
      "                mlsmpmSimulator.execute(commandEncoder, interactionPosition, interactionVelocity,",
      "                    brushRadius * 0.92, sphereRenderFl, maxDt * guiParams.speed * 0.5,",
      "                    guiParams.running, densityGridSize)",
      "            }",
      "        } else {",
      "            mlsmpmSimulator.execute(commandEncoder, defaultPosition, defaultVelocity,",
      "                brushRadius, sphereRenderFl, maxDt * guiParams.speed, guiParams.running,",
      "                densityGridSize)",
      "        }",
    ])
  );
  return moduleURL(compile(source, "main.ts"));
}

function installTouchBridge() {
  let pointerID = null;
  let hiddenHint = false;
  let lastPointerX = 0;
  let lastPointerY = 0;
  let lastPointerTime = 0;
  const activePointers = new Map();

  function dispatchMouseMove(x, y) {
    fluidCanvas.dispatchEvent(new MouseEvent("mousemove", {
      bubbles: false,
      cancelable: false,
      view: window,
      clientX: x,
      clientY: y,
      screenX: x,
      screenY: y,
      buttons: 0
    }));
  }

  function updateSlimePinch() {
    const pinch = window.__stressLabSlimePinch;
    const slimeSelected = MATERIALS[state.selected].id === "slime";
    if (!slimeSelected || activePointers.size < 2) {
      pinch.active = false;
      pinch.a = null;
      pinch.b = null;
      pinch.closing = 0;
      return;
    }
    const points = Array.from(activePointers.values()).slice(0, 2);
    const a = points[0], b = points[1];
    const gap = Math.hypot(a.x - b.x, a.y - b.y);
    const previousGap = Math.hypot(a.prevX - b.prevX, a.prevY - b.prevY);
    pinch.active = true;
    pinch.a = { x:a.x, y:a.y, prevX:a.prevX, prevY:a.prevY };
    pinch.b = { x:b.x, y:b.y, prevX:b.prevX, prevY:b.prevY };
    // Positive while fingers close. A tiny baseline keeps a held pinch gripping.
    pinch.closing = Math.max(4, previousGap - gap);
    window.__stressLabPointerDown = true;
  }

  fluidCanvas.addEventListener("pointerdown", function (event) {
    event.preventDefault();
    activePointers.set(event.pointerId, {
      x:event.clientX, y:event.clientY,
      prevX:event.clientX, prevY:event.clientY
    });

    const selectedId = MATERIALS[state.selected].id;
    if (selectedId === "slime" && activePointers.size >= 2) {
      updateSlimePinch();
      try { fluidCanvas.setPointerCapture(event.pointerId); } catch (_) {}
      return;
    }
    if (pointerID !== null) return;
    pointerID = event.pointerId;
    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
    lastPointerTime = performance.now();
    state.pointerDown = true;
    const snowSelected = selectedId === "snow";
    window.__stressLabPointerDown = !snowSelected;
    try { fluidCanvas.setPointerCapture(pointerID); } catch (_) {}
    if (snowSelected) {
      ensureSnowSystem().beginContact(
        event.clientX,
        event.clientY,
        event.pressure,
        event.width,
        event.height
      );
      dispatchMouseMove(-10000, -10000);
    } else if (event.pointerType !== "mouse") {
      dispatchMouseMove(event.clientX, event.clientY);
    }
    if (!snowSelected) addCloudBrush(event.clientX, event.clientY, 180);
    if (!hiddenHint) {
      hiddenHint = true;
      hint.classList.add("used");
    }
    if (!snowSelected && navigator.vibrate) navigator.vibrate(4);
  }, { passive: false });

  fluidCanvas.addEventListener("pointermove", function (event) {
    const tracked = activePointers.get(event.pointerId);
    if (tracked) {
      tracked.prevX = tracked.x;
      tracked.prevY = tracked.y;
      tracked.x = event.clientX;
      tracked.y = event.clientY;
      updateSlimePinch();
    }
    if (event.pointerId !== pointerID) return;
    event.preventDefault();
    if (window.__stressLabSlimePinch.active) return;
    const now = performance.now();
    const elapsed = Math.max(.008, Math.min(.12, (now - lastPointerTime) / 1000));
    const velocityX = (event.clientX - lastPointerX) / elapsed;
    const velocityY = (event.clientY - lastPointerY) / elapsed;
    const speed = Math.hypot(velocityX, velocityY);
    const snowSelected = MATERIALS[state.selected].id === "snow";
    if (snowSelected) {
      ensureSnowSystem().moveContact(
        event.clientX,
        event.clientY,
        event.pressure,
        event.width,
        event.height
      );
    } else {
      spawnDebris(
        event.clientX, event.clientY, velocityX, velocityY, speed
      );
      addCloudBrush(event.clientX, event.clientY, speed);
    }
    lastPointerX = event.clientX;
    lastPointerY = event.clientY;
    lastPointerTime = now;
    if (!snowSelected && event.pointerType !== "mouse") {
      dispatchMouseMove(event.clientX, event.clientY);
    }
  }, { passive: false });

  function releasePointer(event) {
    activePointers.delete(event.pointerId);
    updateSlimePinch();
    if (event.pointerId !== pointerID) return;

    // If another finger remains after a slime pinch, promote it to primary.
    if (activePointers.size) {
      const remaining = activePointers.entries().next().value;
      pointerID = remaining[0];
      const pt = remaining[1];
      lastPointerX = pt.x;
      lastPointerY = pt.y;
      lastPointerTime = performance.now();
      dispatchMouseMove(pt.x, pt.y);
      return;
    }

    pointerID = null;
    state.pointerDown = false;
    window.__stressLabPointerDown = false;
    if (snowSystem) snowSystem.endContact();
    dispatchMouseMove(-10000, -10000);
  }
  fluidCanvas.addEventListener("pointerup", releasePointer);
  fluidCanvas.addEventListener("pointercancel", releasePointer);
}

async function start() {
  try {
    installTouchBridge();
    status.textContent = "Loading the original Splash camera…";
    const cameraURL = await buildCamera();
    status.textContent = "Building the five material responses…";
    const mpmURL = await buildMLSMPM();
    status.textContent = "Building surface and cloud rendering…";
    const rendererURL = await buildFluidRenderer();
    status.textContent = "Starting the zero-gravity solver…";
    const mainURL = await buildMain(cameraURL, mpmURL, rendererURL);
    await import(mainURL);
    window.setTimeout(function () {
      loading.classList.add("hidden");
    }, 1150);
  } catch (error) {
    fatal(error);
  }
}

start();

</script>
